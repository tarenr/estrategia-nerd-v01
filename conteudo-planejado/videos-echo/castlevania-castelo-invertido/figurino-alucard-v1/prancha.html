<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echo — estudo de fantasia Alucard</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1800px; height: 1000px; overflow: hidden; background: #070b12; color: #edf8ff; font-family: Arial, sans-serif; }
    body { padding: 42px; }
    h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: .04em; }
    .sub { color: #90a5b8; font-size: 17px; margin-bottom: 28px; }
    .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .cartao { height: 800px; border: 1px solid #203044; border-radius: 22px; background: radial-gradient(circle at 50% 42%, #263247 0, #111927 48%, #080d16 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { width: 500px; height: 500px; }
    h2 { margin: 18px 0 8px; font-size: 24px; }
    p { color: #9fb0c2; margin: 0; font-size: 16px; }
  </style>
</head>
<body>
  <h1>ECHO // FANTASIA DE ALUCARD</h1>
  <div class="sub">Estudo isolado do guarda-roupa oficial — cabelo branco, gola alta, capa curta, traje preto e acabamento dourado.</div>
  <main class="grade">
    <section class="cartao"><canvas id="frente"></canvas><h2>Frente</h2><p>Leitura do visor, boca e silhueta</p></section>
    <section class="cartao"><canvas id="tres-quartos"></canvas><h2>Três quartos</h2><p>Cabelo, gola e profundidade da capa</p></section>
    <section class="cartao"><canvas id="pose"></canvas><h2>Pose expressiva</h2><p>Inclinação e movimento das peças</p></section>
  </main>

  <script src="../../../../public/assets/vendor/echo-robo/robo-roupas.js"></script>
  <script src="../../../../public/assets/vendor/echo-robo/robo-roupas-echo.js"></script>
  <script src="alucard-roupa.js"></script>
  <script src="../../../../public/assets/vendor/echo-robo/robo-motor.js"></script>
  <script>
    function montar(id, ajustes) {
      const canvas = document.getElementById(id);
      const bot = new RoboMotor.RoboBot(canvas, { theme: RoboMotor.THEMES.echo });
      bot.setSize(500);
      RoboRoupas.toggleSet(bot.wardrobe, 'alucard', performance.now() - 1000, { exclusive: true });
      Object.assign(bot.s, ajustes);
      bot.draw();
      return bot;
    }
    window.__bots = [
      montar('frente', { yaw: 0, pitch: 0, tilt: 0, mouthOpen: 0.18 }),
      montar('tres-quartos', { yaw: 0.30, pitch: -0.04, tilt: -0.06, mouthOpen: 0 }),
      montar('pose', { yaw: -0.22, pitch: -0.08, tilt: 0.12, oy: -0.05, mouthOpen: 0.42, hands: 0.72 })
    ];
    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
