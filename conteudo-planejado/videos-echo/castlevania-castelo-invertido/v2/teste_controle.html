<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estudo Isolado do Controle - Echo Gamer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 800px; overflow: hidden; background: #0c0718; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; width: 1200px; height: 800px; }
  </style>
</head>
<body>
  <canvas id="cv" width="1200" height="800"></canvas>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    // Fundo estilizado com vinheta escura para destacar o controle
    const bg = ctx.createRadialGradient(600, 400, 100, 600, 400, 700);
    bg.addColorStop(0, '#1c1236');
    bg.addColorStop(1, '#07040d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 1200, 800);

    // Grid sutil no fundo
    ctx.strokeStyle = 'rgba(120, 80, 200, 0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x < 1200; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 800); ctx.stroke(); }
    for (let y = 0; y < 800; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1200, y); ctx.stroke(); }

    // Título técnico discreto no topo
    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = '#62f6ff';
    ctx.textAlign = 'center';
    ctx.fillText('ESTUDO DE GEOMETRIA, RELEVO E LATERALIDADE DO CONTROLE', 600, 60);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('Perspectiva frontal inclinada // Borda espessa com gatilhos // Botões à esquerda // D-Pad à direita', 600, 90);

    // =========================================================================
    // DESENHO VETORIAL COMPLETO DO CONTROLE (100% Canvas 2D)
    // =========================================================================
    function desenharControleDetalhado(ctx, cx, cy, esc) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(esc, esc);

      // Sombra projetada sob o controle
      ctx.save();
      ctx.filter = 'blur(22px)';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.ellipse(0, 110, 260, 45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // -----------------------------------------------------------------------
      // 1. CHASSIS DO CONTROLE: FACE SUPERIOR INCLINADA
      // -----------------------------------------------------------------------
      ctx.save();
      // Superfície superior (inclinada para trás em perspectiva)
      const gradTopo = ctx.createLinearGradient(0, -110, 0, 20);
      gradTopo.addColorStop(0, '#261b40');
      gradTopo.addColorStop(0.5, '#352558');
      gradTopo.addColorStop(1, '#443070');

      ctx.beginPath();
      ctx.moveTo(-220, 20);
      // Lóbulo esquerdo
      ctx.bezierCurveTo(-260, -20, -250, -90, -170, -110);
      ctx.bezierCurveTo(-110, -120, -60, -95, 0, -85); // Recesso central
      // Lóbulo direito
      ctx.bezierCurveTo(60, -95, 110, -120, 170, -110);
      ctx.bezierCurveTo(250, -90, 260, -20, 220, 20);
      // Arco frontal superior
      ctx.quadraticCurveTo(110, 35, 0, 28);
      ctx.quadraticCurveTo(-110, 35, -220, 20);
      ctx.closePath();
      ctx.fillStyle = gradTopo;
      ctx.fill();
      ctx.strokeStyle = '#5a4290';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // -----------------------------------------------------------------------
      // 2. BORDA FRONTAL COM ESPESSURA 3D (GATILHOS E CHANFRO FRONTAL)
      // -----------------------------------------------------------------------
      ctx.save();
      const gradBorda = ctx.createLinearGradient(0, 20, 0, 85);
      gradBorda.addColorStop(0, '#2d1f4a');
      gradBorda.addColorStop(0.6, '#1c1330');
      gradBorda.addColorStop(1, '#0e091a');

      ctx.beginPath();
      // Topo da borda frontal
      ctx.moveTo(-220, 20);
      ctx.quadraticCurveTo(-110, 35, 0, 28);
      ctx.quadraticCurveTo(110, 35, 220, 20);
      // Lateral direita
      ctx.quadraticCurveTo(230, 50, 210, 80);
      // Base da borda frontal
      ctx.quadraticCurveTo(110, 95, 0, 88);
      ctx.quadraticCurveTo(-110, 95, -210, 80);
      // Lateral esquerda
      ctx.quadraticCurveTo(-230, 50, -220, 20);
      ctx.closePath();
      ctx.fillStyle = gradBorda;
      ctx.fill();
      ctx.strokeStyle = '#3e2a66';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Linha de brilho metálico na quina superior frontal
      ctx.strokeStyle = 'rgba(200, 180, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-210, 22);
      ctx.quadraticCurveTo(-110, 36, 0, 29);
      ctx.quadraticCurveTo(110, 36, 210, 22);
      ctx.stroke();

      // GATILHOS / BUMPERS FRONTAIS RETANGULARES (como na ilustração)
      // Gatilho Esquerdo (lado dos botões)
      ctx.fillStyle = '#110b20';
      ctx.fillRect(-175, 36, 85, 34);
      ctx.fillStyle = '#261942';
      ctx.fillRect(-172, 39, 79, 28);
      ctx.strokeStyle = '#4e357e';
      ctx.lineWidth = 2;
      ctx.strokeRect(-172, 39, 79, 28);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(-168, 43, 71, 3); // Friso de relevo

      // Gatilho Direito (lado do direcional)
      ctx.fillStyle = '#110b20';
      ctx.fillRect(90, 36, 85, 34);
      ctx.fillStyle = '#261942';
      ctx.fillRect(93, 39, 79, 28);
      ctx.strokeStyle = '#4e357e';
      ctx.lineWidth = 2;
      ctx.strokeRect(93, 39, 79, 28);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(97, 43, 71, 3); // Friso de relevo

      // Barra de luz LED ciana central no friso frontal
      ctx.save();
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#62f6ff';
      ctx.beginPath();
      ctx.roundRect(-28, 50, 56, 7, 3);
      ctx.fill();
      ctx.restore();
      ctx.restore();

      // -----------------------------------------------------------------------
      // 3. ELEMENTOS DA FACE SUPERIOR (ESPELHADO CONFORME ORIENTAÇÃO):
      //    LADO ESQUERDO: 4 BOTÕES DE AÇÃO EM RELEVO 3D
      //    CENTRO: SELECT / START
      //    LADO DIREITO: D-PAD EM RELEVO 3D + ANALÓGICOS
      // -----------------------------------------------------------------------

      // Função para desenhar botão de ação com relevo cilíndrico 3D
      function desenharBotaoRelevo(bx, by, r, corHex, letra) {
        ctx.save();
        // Sombra projetada do botão
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.beginPath();
        ctx.ellipse(bx, by + 5, r, r * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();

        // Base/corpo cilíndrico (altura 3D)
        ctx.fillStyle = '#160e28';
        ctx.beginPath();
        ctx.ellipse(bx, by + 3, r, r * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cúpula superior do botão
        const gBtn = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.3, r * 0.1, bx, by, r);
        gBtn.addColorStop(0, '#ffffff');
        gBtn.addColorStop(0.35, corHex);
        gBtn.addColorStop(1, '#0e081c');
        ctx.fillStyle = gBtn;
        ctx.beginPath();
        ctx.ellipse(bx, by, r, r * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();
      }

      // Base chanfrada do cluster de botões (lado esquerdo)
      ctx.fillStyle = 'rgba(18, 12, 34, 0.4)';
      ctx.beginPath();
      ctx.ellipse(-140, -50, 58, 48, 0, 0, Math.PI * 2);
      ctx.fill();

      // 4 Botões coloridos em diamante com relevo evidente
      desenharBotaoRelevo(-140, -84, 15, '#5cf5a8', 'X'); // Topo (Verde)
      desenharBotaoRelevo(-178, -50, 15, '#62f6ff', 'Y'); // Esquerda (Ciano)
      desenharBotaoRelevo(-102, -50, 15, '#ffd257', 'A'); // Direita (Amarelo)
      desenharBotaoRelevo(-140, -16, 15, '#ff5ad8', 'B'); // Baixo (Rosa)

      // BOTÕES CENTRAIS (SELECT / START)
      function desenharPillBotao(px, py, txt) {
        ctx.save();
        ctx.fillStyle = '#120b22';
        ctx.beginPath();
        ctx.roundRect(px - 16, py - 6, 32, 12, 6);
        ctx.fill();
        ctx.fillStyle = '#3a2760';
        ctx.beginPath();
        ctx.roundRect(px - 15, py - 8, 30, 10, 5);
        ctx.fill();
        ctx.strokeStyle = '#5a3d90';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
      desenharPillBotao(-42, -38, 'SELECT');
      desenharPillBotao(42, -38, 'START');

      // -----------------------------------------------------------------------
      // LADO DIREITO: D-PAD EM RELEVO DE CRUZ 3D (MÃO ESQUERDA DO ECHO)
      // -----------------------------------------------------------------------
      ctx.save();
      const dx = 140, dy = -54;

      // Berço circular chanfrado sob o direcional
      ctx.fillStyle = '#140c26';
      ctx.beginPath();
      ctx.ellipse(dx, dy + 4, 52, 42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#322055';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Cruz do direcional (D-PAD) com espessura 3D
      const wCross = 28, armL = 36;
      function pathCruz(ox, oy) {
        ctx.beginPath();
        ctx.moveTo(ox - wCross / 2, oy - armL);
        ctx.lineTo(ox + wCross / 2, oy - armL);
        ctx.lineTo(ox + wCross / 2, oy - wCross / 2);
        ctx.lineTo(ox + armL, oy - wCross / 2);
        ctx.lineTo(ox + armL, oy + wCross / 2);
        ctx.lineTo(ox + wCross / 2, oy + wCross / 2);
        ctx.lineTo(ox + wCross / 2, oy + armL);
        ctx.lineTo(ox - wCross / 2, oy + armL);
        ctx.lineTo(ox - wCross / 2, oy + wCross / 2);
        ctx.lineTo(ox - armL, oy + wCross / 2);
        ctx.lineTo(ox - armL, oy - wCross / 2);
        ctx.lineTo(ox - wCross / 2, oy - wCross / 2);
        ctx.closePath();
      }

      // Base da cruz (extrusão 3D para baixo)
      ctx.fillStyle = '#0f081c';
      pathCruz(dx, dy + 5);
      ctx.fill();

      // Face superior do direcional com chanfro
      const gCross = ctx.createLinearGradient(dx, dy - armL, dx, dy + armL);
      gCross.addColorStop(0, '#423068');
      gCross.addColorStop(0.5, '#2c1e48');
      gCross.addColorStop(1, '#1b122e');
      pathCruz(dx, dy);
      ctx.fillStyle = gCross;
      ctx.fill();
      ctx.strokeStyle = '#63499a';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Centro côncavo do D-Pad
      ctx.fillStyle = '#150d26';
      ctx.beginPath();
      ctx.arc(dx, dy, 9, 0, Math.PI * 2);
      ctx.fill();

      // Setinhas triangulares em relevo nas pontas
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      // Cima
      ctx.beginPath(); ctx.moveTo(dx, dy - 26); ctx.lineTo(dx - 5, dy - 18); ctx.lineTo(dx + 5, dy - 18); ctx.closePath(); ctx.fill();
      // Baixo
      ctx.beginPath(); ctx.moveTo(dx, dy + 26); ctx.lineTo(dx - 5, dy + 18); ctx.lineTo(dx + 5, dy + 18); ctx.closePath(); ctx.fill();
      // Esquerda
      ctx.beginPath(); ctx.moveTo(dx - 26, dy); ctx.lineTo(dx - 18, dy - 5); ctx.lineTo(dx - 18, dy + 5); ctx.closePath(); ctx.fill();
      // Direita
      ctx.beginPath(); ctx.moveTo(dx + 26, dy); ctx.lineTo(dx + 18, dy - 5); ctx.lineTo(dx + 18, dy + 5); ctx.closePath(); ctx.fill();
      ctx.restore();

      // -----------------------------------------------------------------------
      // DOIS ANALÓGICOS EM RELEVO 3D (CENTRAIS / PROJETADOS)
      // -----------------------------------------------------------------------
      function desenharStick3D(sx, sy) {
        ctx.save();
        // Berço rebaixado
        ctx.fillStyle = '#100920';
        ctx.beginPath();
        ctx.ellipse(sx, sy + 4, 34, 26, 0, 0, Math.PI * 2);
        ctx.fill();

        // Haste cilíndrica 3D
        ctx.fillStyle = '#22153c';
        ctx.fillRect(sx - 9, sy - 8, 18, 16);

        // Cúpula do cogumelo (relevo 3D evidente)
        const gCap = ctx.createRadialGradient(sx - 6, sy - 14, 3, sx, sy - 10, 24);
        gCap.addColorStop(0, '#5a428a');
        gCap.addColorStop(0.4, '#342454');
        gCap.addColorStop(1, '#180f2b');
        ctx.fillStyle = gCap;
        ctx.beginPath();
        ctx.ellipse(sx, sy - 10, 26, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#7456b0';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Depressão côncava central do analógico com textura
        ctx.fillStyle = '#120b22';
        ctx.beginPath();
        ctx.ellipse(sx, sy - 10, 16, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.restore();
      }

      desenharStick3D(-55, -2); // Stick esquerdo
      desenharStick3D(55, -2);  // Stick direito

      // -----------------------------------------------------------------------
      // 4. MÃOS CIANO DO ECHO (EMPUNHADURA ANATÔMICA DAS LATERAIS DA ILUSTRAÇÃO)
      // -----------------------------------------------------------------------
      function desenharMaoEcho(mx, my, isEsquerda) {
        ctx.save();
        // Sombra de contato da mão com o controle
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.beginPath();
        ctx.ellipse(mx + (isEsquerda ? -6 : 6), my + 8, 38, 30, 0, 0, Math.PI * 2);
        ctx.fill();

        // Esfera principal da mão do Echo
        const rMao = 34;
        const gMao = ctx.createRadialGradient(mx - rMao * 0.35, my - rMao * 0.35, 4, mx, my, rMao);
        gMao.addColorStop(0, '#ffffff');
        gMao.addColorStop(0.3, '#7fe3f5');
        gMao.addColorStop(0.8, '#00d4ff');
        gMao.addColorStop(1, '#008ba8');

        ctx.fillStyle = gMao;
        ctx.beginPath();
        ctx.arc(mx, my, rMao, 0, Math.PI * 2);
        ctx.fill();

        // Contorno clássico com glow ciano do Echo
        ctx.shadowColor = 'rgba(0, 212, 255, 0.6)';
        ctx.shadowBlur = 10;
        ctx.strokeStyle = '#00d4ff';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Detalhe do polegar apoiado no topo da lateral
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#7fe3f5';
        ctx.strokeStyle = '#00d4ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(mx + (isEsquerda ? 16 : -16), my - 24, 14, 11, (isEsquerda ? -0.4 : 0.4), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }

      // Mão direita do Echo (lado esquerdo da tela)
      desenharMaoEcho(-235, 30, false);
      // Mão esquerda do Echo (lado direito da tela)
      desenharMaoEcho(235, 30, true);

      ctx.restore();
    }

    // Renderizar o controle em escala grande e nítida
    desenharControleDetalhado(ctx, 600, 440, 1.7);

    window._RENDER_FINISHED = true;
    console.log('Estudo do controle renderizado com sucesso.');
  </script>
</body>
</html>
