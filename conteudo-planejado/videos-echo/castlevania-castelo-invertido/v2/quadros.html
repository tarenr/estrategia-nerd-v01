<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Prancha Editorial Castlevania SOTN v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <video id="video-gameplay" src="assets/gameplay_sync.mp4" muted playsinline preload="auto" style="display: none;"></video>

  <script src="vendor/robo-roupas.js"></script>
  <script src="vendor/robo-motor.js"></script>
  <script src="vendor/echo-director.js"></script>
  <script src="vendor/setup_desenho.js"></script>
  <script src="timeline-v2.cjs"></script>
  <script src="cenas_v2.js"></script>

  <script>
    (async function() {
      const cv = document.getElementById('cv');
      const ctx = cv.getContext('2d');
      const vid = document.getElementById('video-gameplay');
      const params = new URLSearchParams(window.location.search);
      const q = params.get('quadro');
      const tParam = params.get('t');
      // render em pedaços: ?offset= é o início do pedaço e ?dur= a duração (sem eles, o vídeo inteiro)
      const offset = parseFloat(params.get('offset') || '0') || 0;
      const durParam = parseFloat(params.get('dur') || '');

      window.CenasV2.setVideoElement(vid);
      window.__meta = { dur: Number.isFinite(durParam) ? durParam : 44.57 - offset };

      async function buscarVideo(t) {
        if (vid.readyState < 2) {
          await new Promise(r => {
            vid.addEventListener('loadeddata', r, { once: true });
            setTimeout(r, 1200);
          });
        }
        if (Math.abs(vid.currentTime - t) > 0.025) {
          await new Promise(r => {
            const conclui = () => r();
            vid.addEventListener('seeked', conclui, { once: true });
            vid.currentTime = Math.min(t, vid.duration || t);
            setTimeout(conclui, 900);
          });
        }
      }

      window.__seek = async function(t) {
        const tt = t + offset;
        await buscarVideo(tt);
        await window.CenasV2.renderizarQuadro(ctx, tt, vid);
      };

      window.__ready = window.__seek(0);
      await window.__ready;

      if (tParam !== null) {
        const t = parseFloat(tParam);
        await window.__seek(t);
      }

      window._RENDER_FINISHED = true;
      console.log('Quadro renderizado com sucesso:', q || tParam);
    })();
  </script>
</body>
</html>
