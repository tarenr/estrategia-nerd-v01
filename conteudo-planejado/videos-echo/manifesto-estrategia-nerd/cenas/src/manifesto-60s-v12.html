        if (t <= PHONETIC_KEYFRAMES[0][0]) return 0.0;

          const [t0, v0] = PHONETIC_KEYFRAMES[i];

        const T = ctx.getTransform();

        for (const [px, py] of [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]) {
          const X = T.a * px + T.c * py + T.e;
          const Y = T.b * px + T.d * py + T.f;
          const recorte = Y >= 970 ? 925 - X : Math.max(925 - X, 970 - Y);
          m = Math.min(m, X - 72, 1008 - X, Y - 170, 1540 - Y, recorte);
        }
        return m;
      }

      // manchete em rabisco (para o cartão que está perto da borda ou fora da zona segura)
      function rabiscoManchete(ctx, x, y, larguras, cor) {
        ctx.save();
        ctx.strokeStyle = cor;
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        larguras.forEach((lw, i) => {
          const yy = y + i * 14;
          ctx.beginPath();
          ctx.moveTo(x, yy);
          for (let sx = 0; sx <= lw; sx += 6) ctx.lineTo(x + sx, yy + Math.sin(sx * 0.42 + i * 1.7) * 1.1);
          ctx.stroke();
        });
        ctx.restore();
      }

      // cor de tinta de cada editoria (a da v9 era neon para fundo escuro; no papel fica mais funda)
      const TINTA_EDITORIA = { '#00F0FF': '#0a86ad', '#A855F7': '#7c3fc4', '#10B981': '#0f8a5f', '#F5A524': '#c06f0c' };

      function drawStandardSmallCard(ctx, cx, cy, rotDeg, scale, alpha, pill, pillCol, art, l1, l2, t) {
        if (alpha <= 0.01) return;
        const w = 212;
        const h = 70;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((rotDeg * Math.PI) / 180);
        ctx.scale(scale, scale);
        ctx.translate(-w / 2, -h / 2);
        ctx.globalAlpha = clamp01(alpha);

        // v11: notícia impressa em papel, iluminada pela rua (foto, editoria e manchete)
        ctx.shadowColor = 'rgba(10, 6, 22, 0.55)';
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 6;
        const papel = ctx.createLinearGradient(0, 0, 0, h);
        papel.addColorStop(0, '#fbf6ec');
        papel.addColorStop(1, '#ecdfc8');
        ctx.fillStyle = papel;
        roundRect(ctx, 0, 0, w, h, 6);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = 'rgba(122, 92, 58, 0.40)';
        ctx.lineWidth = 1;
        roundRect(ctx, 0, 0, w, h, 6);
        ctx.stroke();

        drawStandardIllustration(ctx, art, 6, 6, 64, 58, pillCol, t);

        const tinta = TINTA_EDITORIA[pillCol] || '#5a4a7a';
        ctx.fillStyle = tinta;
        roundRect(ctx, 78, 10, 4, 12, 2);
        ctx.fill();

        // texto só dentro da zona segura; chegando perto da borda, a manchete vira rabisco
        const dentro = clamp01(margemZonaSegura(ctx, 76, 8, 208, 56) / 8);
        const base = ctx.globalAlpha;
        if (dentro < 0.99) {
          ctx.globalAlpha = base * (1 - dentro);
          rabiscoManchete(ctx, 86, 16, [56], tinta);
          rabiscoManchete(ctx, 78, 33, [118, 84], 'rgba(34, 29, 51, 0.7)');
        }
        if (dentro > 0.01) {
          ctx.globalAlpha = base * dentro;
          ctx.font = '700 10.5px Rajdhani, sans-serif';
          ctx.fillStyle = tinta;
          ctx.textAlign = 'left';
          ctx.fillText(pill, 86, 20);
          ctx.font = '700 10.5px SpaceGrotesk, sans-serif';
          ctx.fillStyle = '#221d33';
          ctx.fillText(l1, 78, 37);
          ctx.fillText(l2, 78, 51);
        }
        ctx.globalAlpha = base;
        // linha da fonte da notícia (sem texto)
        ctx.fillStyle = 'rgba(107, 98, 128, 0.35)';
        roundRect(ctx, 78, 59, 44, 3, 1.5);
        ctx.fill();

        ctx.restore();
      }

      window.__initScene = function() {
        const masterCanvas = document.getElementById('master-canvas');
        const ctx = masterCanvas.getContext('2d');
        const echoCanvas = document.getElementById('echo-offscreen');
        const director = new EchoDirector(echoCanvas);

        const echoSize = 400;
        director.setSize(echoSize * 2);   // v11: desenhado em 800 px para ficar nítido no quadro de 1080

        // v11: a praça (rua noturna) é o fundo dos 0–18 s; escurece nas batidas de foco
        // (mesma curva do bgDim das notícias da v9) e acalma no fim, ligando com o quarto roxo da T1
        const PRACA = PracaDesenho.criar();
        function escuroPraca(t) {
          let d = 1.0;
          if (t >= 0.95 && t < 6.00) d = lerp(1.0, 0.52, easeOutCubic((t - 0.95) / 0.95));
          else if (t >= 6.00 && t <= 12.60) d = lerp(0.52, 0.22, easeInOutCubic(invLerp(6.00, 6.45, t)));
          else if (t > 12.60 && t < 13.95) d = lerp(0.22, 0.50, easeInOutCubic(invLerp(12.60, 13.15, t)));
          else if (t >= 13.95) d = lerp(0.50, 0.26, easeInOutCubic(invLerp(13.95, 14.55, t)));
          return 1 - d;
        }
        function desenharPracaV11(ctx, t) {
          const L = PRACA.L;
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          for (const n of ['ceu', 'fundo', 'fachadas', 'chao', 'postes']) ctx.drawImage(L[n], 0, 0);
          ctx.globalCompositeOperation = 'screen';
          ctx.drawImage(L.luz, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
          const e = escuroPraca(t);
          if (e > 0.005) {
            ctx.fillStyle = `rgba(8, 6, 22, ${(0.62 * e).toFixed(3)})`;
            ctx.fillRect(0, 0, 1080, 1920);
          }
          const calma = easeInOutCubic(invLerp(13.45, 14.80, t)) * 0.85;
          if (calma > 0.005) PRACA.clima(ctx, { calma });
          ctx.restore();
        }
        function desenharAcabamentoPraca(ctx) {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(PRACA.L.acabamento, 0, 0);
          ctx.restore();
        }

        function drawBgNewsItem(ctx, item, t, sceneDimFactor) {
          const spanX = 540 + 260;
          const spanY = 960 + 200;
          const rawX = (item.x0 + 106) + item.vx * t + item.ax * Math.sin(item.wx * t + item.ph);
          const rawY = (item.y0 + 35) + item.vy * t + item.ay * Math.cos(item.wy * t + item.ph);

          const cx = ((((rawX + 130) % spanX) + spanX) % spanX) - 130;
          const cy = ((((rawY + 100) % spanY) + spanY) % spanY) - 100;

          const depthWave = Math.sin(t * 0.85 + item.ph);
          const scale = item.scale0 + depthWave * 0.04;
          const rotDeg = item.rot0 + Math.sin(t * 0.9 + item.ph) * 2.5;
          const baseAlpha = lerp(0.88, 0.98, (depthWave + 1) * 0.5);

          drawStandardSmallCard(
            ctx, cx, cy, rotDeg, scale, baseAlpha * sceneDimFactor,
            item.pill, item.pillCol, item.art, item.l1, item.l2, t
          );
        }

        // =====================================================================
        // 4. PUBLICAÇÃO DA GPU (0.00s – 6.35s — PRESERVADA INTEGRALMENTE)
        // =====================================================================
        function drawGpuPublication(ctx, state) {
          const { cx, cy, w, h, rotDeg, scale, expandProg, impactFlash, alpha, t } = state;
          if (alpha <= 0.01) return;

          if (expandProg <= 0.001 && impactFlash <= 0.01) {
            drawStandardSmallCard(
              ctx, cx, cy, rotDeg, scale, alpha,
              'HARDWARE', '#00F0FF', 'gpu', '“A MELHOR GPU', 'DE TODAS!”', t
            );
            return;
          }

          // v11: o post vira uma folha de papel iluminada pela rua. Geometria, tempos e
          // textos da v9; sem números inventados e sem @ de perfil.
          const PAPEL_A = '#fbf5ea', PAPEL_B = '#ecdfc8', TINTA = '#221d33', TINTA_SUAVE = '#6b6280';
          const AMBAR = '#d97a12', OURO = '#f5b83d', VERMELHO = '#d6343a', TEAL = '#0a86ad';
          const r = lerp(6, 16, expandProg);
          const cosmeticProg = easeOutCubic(invLerp(3.95, 4.65, t));

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate((rotDeg * Math.PI) / 180);
          ctx.scale(scale, scale);
          ctx.translate(-w / 2, -h / 2);
          ctx.globalAlpha = clamp01(alpha);

          ctx.shadowColor = `rgba(10, 6, 22, ${lerp(0.55, 0.82, expandProg).toFixed(3)})`;
          ctx.shadowBlur = lerp(14, 44, expandProg);
          ctx.shadowOffsetY = lerp(6, 18, expandProg);
          const papel = ctx.createLinearGradient(0, 0, 0, h);
          papel.addColorStop(0, PAPEL_A);
          papel.addColorStop(1, PAPEL_B);
          ctx.fillStyle = papel;
          roundRect(ctx, 0, 0, w, h, r);
          ctx.fill();
          ctx.shadowColor = 'transparent';

          if (impactFlash > 0.02) {
            ctx.strokeStyle = `rgba(217, 122, 18, ${clamp(0.3 + impactFlash * 0.65, 0, 1)})`;
            ctx.lineWidth = 2.2;
          } else if (cosmeticProg > 0.05) {
            ctx.strokeStyle = `rgba(245, 184, 61, ${lerp(0.5, 1.0, cosmeticProg)})`;
            ctx.lineWidth = lerp(1.6, 3.0, cosmeticProg);
          } else {
            ctx.strokeStyle = `rgba(122, 92, 58, ${lerp(0.4, 0.5, expandProg)})`;
            ctx.lineWidth = lerp(1.0, 1.4, expandProg);
          }
          roundRect(ctx, 0, 0, w, h, r);
          ctx.stroke();

          ctx.save();
          roundRect(ctx, 0, 0, w, h, r);
          ctx.clip();

          const pHeader = easeOutCubic(clamp((expandProg - 0.32) / 0.42, 0, 1));
          const pImgLayout = easeInOutCubic(clamp(expandProg / 0.80, 0, 1));
          const pHeadline = easeInOutCubic(clamp((expandProg - 0.16) / 0.66, 0, 1));
          const pAnaliseTag = easeBackOut(clamp((expandProg - 0.46) / 0.44, 0, 1));

          if (expandProg < 0.16) {
            const miniPillAlpha = clamp(1 - expandProg / 0.14, 0, 1);
            ctx.save();
            ctx.globalAlpha *= miniPillAlpha;
            ctx.fillStyle = TEAL;
            roundRect(ctx, 78, 10, 4, 12, 2);
            ctx.fill();
            ctx.font = '700 10.5px Rajdhani, sans-serif';
            ctx.fillStyle = TEAL;
            ctx.textAlign = 'left';
            ctx.fillText('HARDWARE', 86, 20);
            ctx.restore();
          }

          const barsReveal = easeInOutCubic(invLerp(4.20, 4.62, t));
          const imgX = lerp(7, 18, pImgLayout);
          const imgY = lerp(8, 46, pImgLayout);
          const fullHeroW = w - 36;
          const imgW = lerp(64, lerp(fullHeroW, 232, barsReveal), pImgLayout);
          const imgH = lerp(54, 146, pImgLayout);

          drawStandardIllustration(ctx, 'gpu', imgX, imgY, imgW, imgH, cosmeticProg > 0.2 ? '#F5A524' : '#00F0FF', t);
          const pFoto = clamp((expandProg - 0.04) / 0.36, 0, 1);
          if (pFoto > 0.01) {
            ctx.save();
            ctx.globalAlpha *= pFoto;
            PracaDesenho.estilo.gpu(ctx, imgX, imgY, imgW, imgH, t, { cor: cosmeticProg > 0.2 ? OURO : '#ff6b5f' });
            ctx.restore();
          }

          if (t >= 3.96) {
            const stampP = easeBackOut(invLerp(3.96, 4.24, t), 1.5);
            ctx.save();
            ctx.translate(imgX + imgW - 64, imgY + 22);
            ctx.rotate(-0.05);
            ctx.scale(stampP, stampP);
            ctx.fillStyle = OURO;
            roundRect(ctx, -56, -12, 112, 24, 5);
            ctx.fill();
            ctx.strokeStyle = '#b8741a';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.font = '700 12px Rajdhani, sans-serif';
            ctx.fillStyle = '#3a2508';
            ctx.textAlign = 'center';
            ctx.fillText('★★★★★  TOP', 0, 4.5);
            ctx.restore();
          }

          if (barsReveal > 0.02) {
            const bx = imgX + imgW + 10;
            const bw = (w - 36) - imgW - 10;
            const by = imgY;
            const bh = imgH;

            ctx.save();
            ctx.globalAlpha *= barsReveal;
            const tela = ctx.createLinearGradient(0, by, 0, by + bh);
            tela.addColorStop(0, '#2e2850');
            tela.addColorStop(1, '#1d1834');
            ctx.fillStyle = tela;
            roundRect(ctx, bx, by, bw, bh, 10);
            ctx.fill();
            ctx.strokeStyle = 'rgba(245, 184, 61, 0.6)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.font = '700 11px Rajdhani, sans-serif';
            ctx.fillStyle = '#f5c25a';
            ctx.textAlign = 'left';
            ctx.fillText('AVALIAÇÃO:', bx + 12, by + 18);

            const fakeBars = [
              { lbl: 'FPS', fill: 0.96, t0: 4.26 },
              { lbl: 'TEMP', fill: 0.88, t0: 4.40 },
              { lbl: 'SCORE', fill: 0.94, t0: 4.54 }
            ];
            fakeBars.forEach((fb, idx) => {
              const fy = by + 34 + idx * 32;
              const fp = easeOutCubic(invLerp(fb.t0, fb.t0 + 0.26, t));
              ctx.font = '700 10.5px SpaceGrotesk, sans-serif';
              ctx.fillStyle = '#f3ead8';
              ctx.fillText(fb.lbl, bx + 12, fy);

              ctx.fillStyle = '#3d3760';
              roundRect(ctx, bx + 12, fy + 5, bw - 24, 9, 4);
              ctx.fill();

              ctx.fillStyle = OURO;
              roundRect(ctx, bx + 12, fy + 5, Math.max(8, (bw - 24) * fb.fill * fp), 9, 4);
              ctx.fill();
            });

            if (t >= 4.72) {
              ctx.globalAlpha *= invLerp(4.72, 4.95, t);
              ctx.font = '700 10px Rajdhani, sans-serif';
              ctx.fillStyle = '#ff8a7a';
              ctx.fillText('⚠ SEM TESTE REAL', bx + 12, by + bh - 10);
            }
            ctx.restore();
          }

          if (expandProg < 0.16) {
            const miniTextAlpha = clamp(1 - expandProg / 0.14, 0, 1);
            ctx.save();
            ctx.globalAlpha *= miniTextAlpha;
            ctx.font = '700 10.5px SpaceGrotesk, sans-serif';
            ctx.fillStyle = TINTA;
            ctx.textAlign = 'left';
            ctx.fillText('“A MELHOR GPU', 78, 37);
            ctx.fillText('DE TODAS!”', 78, 51);
            ctx.restore();
          }

          if (pHeadline > 0.05) {
            ctx.save();
            ctx.globalAlpha *= clamp((pHeadline - 0.05) / 0.35, 0, 1);

            const hlX = 18;
            const hlY = Math.max(imgY + imgH + 26, lerp(162, 220, pHeadline));
            const hlFontPx = lerp(14.5, 23.0, pHeadline);

            // A partir de 3,37s com fade de ~0,2s (pSub): a faixa cresce e entram as barras (R3)
            const pSub = easeOutCubic(invLerp(3.37, 3.57, t));
            const hlH = lerp(36, 52, pSub);

            const opinionHighlight = clamp((t - 1.76) / 0.24, 0, 1);
            if (opinionHighlight > 0.01) {
              // marca-texto âmbar passando sobre a frase (a opinião fica marcada)
              ctx.fillStyle = `rgba(245, 184, 61, ${(0.42 * opinionHighlight).toFixed(3)})`;
              roundRect(ctx, 14, hlY - 21, Math.max(12, (w - 28) * clamp01(opinionHighlight * 1.4)), hlH, 6);
              ctx.fill();
            }

            ctx.font = `700 ${hlFontPx.toFixed(1)}px SpaceGrotesk, sans-serif`;
            ctx.fillStyle = TINTA;
            ctx.textAlign = 'left';
            ctx.fillText('“A MELHOR GPU DE TODAS!”', hlX, hlY);

            // R3: barras-esqueleto DENTRO da faixa amarela a partir de 3,37s com fade suave
            if (pSub > 0.01) {
              ctx.save();
              ctx.globalAlpha *= pSub;
              ctx.fillStyle = 'rgba(34, 29, 51, 0.42)';
              roundRect(ctx, hlX, hlY + 8, 220, 6, 3);
              ctx.fill();
              ctx.fillStyle = 'rgba(34, 29, 51, 0.30)';
              roundRect(ctx, hlX + 228, hlY + 8, 75, 6, 3);
              ctx.fill();
              ctx.fillStyle = 'rgba(34, 29, 51, 0.38)';
              roundRect(ctx, hlX, hlY + 17, 140, 6, 3);
              ctx.fill();
              ctx.restore();
            }
            ctx.restore();
          }

          if (expandProg > 0.42) {
            const dockAlpha = clamp((expandProg - 0.42) / 0.30, 0, 1);
            const dockY = 256;
            const dockH = 95;

            ctx.save();
            ctx.globalAlpha *= dockAlpha;

            // Fundo bege do dock desaparece suavemente com a entrada do B1 (3,37 a 3,57 s)
            const pSub = easeOutCubic(invLerp(3.37, 3.57, t));
            const dockBgAlpha = clamp01(1 - pSub);
            if (dockBgAlpha > 0.01) {
              ctx.save();
              ctx.globalAlpha *= dockBgAlpha;
              ctx.fillStyle = '#e6d8bd';
              roundRect(ctx, 14, dockY, w - 28, dockH, 10);
              ctx.fill();
              ctx.strokeStyle = 'rgba(122, 92, 58, 0.35)';
              ctx.lineWidth = 1;
              ctx.stroke();
              ctx.restore();
            }

            if (t < 3.45) {
              const pQuestion = clamp((t - 1.76) / 0.20, 0, 1);
              const pAnMove = easeInOutCubic(clamp((t - 1.82) / 0.26, 0, 1));
              const pOp = easeBackOut(clamp((t - 2.00) / 0.24, 0, 1));
              const pNeq = easeBackOut(clamp((t - 2.22) / 0.22, 0, 1));
              const neqImpactNudge = t >= 2.22 ? Math.sin(clamp((t - 2.22) / 0.22, 0, 1) * Math.PI) * 5.5 : 0;

              // ANÁLISE: carimbo de tinta azul-petróleo
              const tagScale = clamp(pAnaliseTag, 0, 1);
              if (tagScale > 0.01) {
                const tagCenterX = lerp(108, 342, pAnMove) + neqImpactNudge;
                const tagCenterY = dockY + 50;
                const tagW = lerp(148, 152, pAnMove);
                const tagH = lerp(34, 44, pAnMove);

                const doubtWobble = (t >= 1.76 && t <= 2.04)
                  ? Math.sin((t - 1.76) * 52) * 3.5 * (1 - (t - 1.76) / 0.28)
                  : 0;

                ctx.save();
                ctx.translate(tagCenterX, tagCenterY);
                ctx.rotate(((doubtWobble - 2.5 * pAnMove) * Math.PI) / 180);
                ctx.scale(tagScale, tagScale);

                ctx.fillStyle = pAnMove < 0.5 ? 'rgba(10, 134, 173, 0.08)' : 'rgba(10, 134, 173, 0.13)';
                roundRect(ctx, -tagW / 2, -tagH / 2, tagW, tagH, 7);
                ctx.fill();

                ctx.strokeStyle = (pQuestion > 0.1 && pAnMove < 0.7) ? AMBAR : TEAL;
                ctx.lineWidth = lerp(2.0, 2.8, pAnMove);
                ctx.stroke();

                ctx.font = '700 11px Rajdhani, sans-serif';
                ctx.fillStyle = TEAL;
                ctx.textAlign = 'center';
                const topCaption = pAnMove < 0.45
                  ? (pQuestion > 0.15 ? 'CLASSIFICAÇÃO ?!' : 'CLASSIFICAÇÃO:')
                  : 'COM DADOS E MÉTODO';
                ctx.fillText(topCaption, 0, -tagH / 2 - 6);

                const anFontPx = lerp(16, 24, pAnMove);
                ctx.font = `700 ${anFontPx.toFixed(1)}px SpaceGrotesk, sans-serif`;
                ctx.fillStyle = TEAL;
                ctx.fillText('ANÁLISE', 0, lerp(6, 9, pAnMove));
                ctx.restore();
              }

              // OPINIÃO: carimbo âmbar
              if (pOp > 0.01) {
                const opCenterX = 106 - neqImpactNudge;
                const opCenterY = lerp(220, dockY + 50, easeOutCubic(clamp((t - 2.00) / 0.22, 0, 1)));
                const opW = 152;
                const opH = 44;

                ctx.save();
                ctx.globalAlpha *= clamp((t - 2.00) / 0.14, 0, 1);
                ctx.translate(opCenterX, opCenterY);
                ctx.rotate((2.5 * pOp * Math.PI) / 180);
                ctx.scale(lerp(0.75, 1.0, pOp), lerp(0.75, 1.0, pOp));

                ctx.fillStyle = 'rgba(217, 122, 18, 0.12)';
                roundRect(ctx, -opW / 2, -opH / 2, opW, opH, 7);
                ctx.fill();
                ctx.strokeStyle = AMBAR;
                ctx.lineWidth = 2.6;
                ctx.stroke();

                ctx.font = '700 11px Rajdhani, sans-serif';
                ctx.fillStyle = '#a85a08';
                ctx.textAlign = 'center';
                ctx.fillText('AFIRMAÇÃO SEM BASE', 0, -opH / 2 - 6);

                ctx.font = '700 24px SpaceGrotesk, sans-serif';
                ctx.fillStyle = AMBAR;
                ctx.fillText('OPINIÃO', 0, 9);
                ctx.restore();
              }

              if (pNeq > 0.01) {
                const neqX = w / 2;
                const neqY = dockY + 50;
                const neqScale = lerp(0.3, 1.0, pNeq);

                ctx.save();
                ctx.translate(neqX, neqY);
                ctx.scale(neqScale, neqScale);
                ctx.fillStyle = VERMELHO;
                ctx.beginPath();
                ctx.arc(0, 0, 21, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#8f1d22';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.font = '700 28px SpaceGrotesk, sans-serif';
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.fillText('≠', 0, 9);
                ctx.restore();
              }
            } else {
              const pAchismo = easeOutCubic(invLerp(3.45, 3.82, t));
              const pCara = easeOutCubic(invLerp(4.02, 4.55, t));
              const pScan = easeInOutCubic(invLerp(5.05, 5.52, t));

              // Papel do ACHISMO ocupa a área do dock sem borda bege externa
              const boxX = 14;
              const boxW = w - 28;
              const boxY = dockY;
              const boxH = dockH;

              // Papel rabiscado com ACHISMO na base
              ctx.save();
              ctx.globalAlpha *= pAchismo;
              ctx.fillStyle = '#fbf7ee';
              roundRect(ctx, boxX, boxY, boxW, boxH, 10);
              ctx.fill();
              ctx.strokeStyle = 'rgba(74, 68, 88, 0.45)';
              ctx.lineWidth = 1.4;
              roundRect(ctx, boxX, boxY, boxW, boxH, 10);
              ctx.stroke();

              // Linhas e barras-esqueleto de grafite (R3) simulando rascunho de texto
              ctx.save();
              ctx.fillStyle = 'rgba(74, 68, 88, 0.24)';
              roundRect(ctx, boxX + 16, boxY + 12, (boxW - 32) * 0.82, 6, 3);
              ctx.fill();
              ctx.fillStyle = 'rgba(74, 68, 88, 0.18)';
              roundRect(ctx, boxX + 16, boxY + 23, (boxW - 32) * 0.65, 6, 3);
              ctx.fill();
              ctx.fillStyle = 'rgba(74, 68, 88, 0.15)';
              roundRect(ctx, boxX + 16, boxY + 34, (boxW - 32) * 0.88, 6, 3);
              ctx.fill();

              // Rabiscos leves de grafite a lápis
              ctx.strokeStyle = 'rgba(74, 68, 88, 0.14)';
              ctx.lineWidth = 1.0;
              for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(boxX + 16, boxY + 16 + i * 14);
                for (let sx = 0; sx <= boxW - 32; sx += 10) {
                  ctx.lineTo(boxX + 16 + sx, boxY + 16 + i * 14 + Math.sin(sx * 0.45 + i) * 1.5);
                }
                ctx.stroke();
              }
              ctx.restore();

              // ACHISMO em vermelho (visível na base quando a moldura desce)
              ctx.font = '700 24px SpaceGrotesk, sans-serif';
              ctx.fillStyle = VERMELHO;
              ctx.textAlign = 'center';
              const achismoY = lerp(boxY + 54, boxY + boxH - 12, pCara);
              ctx.fillText('ACHISMO', w / 2, achismoY);
              ctx.restore();

              // A moldura brilhante de vídeo ("CONTEÚDO") desce e VESTE o papel por cima
              if (t >= 4.00) {
                ctx.save();
                ctx.globalAlpha *= pCara;
                const vH = 48;
                const vY = boxY;

                const brilho = ctx.createLinearGradient(boxX, vY, boxX + boxW, vY + vH);
                brilho.addColorStop(0, '#3a3166');
                brilho.addColorStop(1, '#1a1532');
                ctx.fillStyle = brilho;
                roundRect(ctx, boxX, vY, boxW, vH, 10);
                ctx.fill();

                // Reflexo diagonal de vidro
                ctx.fillStyle = 'rgba(255, 255, 255, 0.10)';
                ctx.beginPath();
                ctx.moveTo(boxX + 6, vY);
                ctx.lineTo(boxX + boxW * 0.38, vY);
                ctx.lineTo(boxX + boxW * 0.22, vY + vH);
                ctx.lineTo(boxX + 6, vY + vH);
                ctx.closePath();
                ctx.fill();

                // Contorno brilhante da moldura
                ctx.strokeStyle = pScan > 0.5 ? OURO : '#7fe3f5';
                ctx.lineWidth = 2.0;
                roundRect(ctx, boxX, vY, boxW, vH, 10);
                ctx.stroke();

                // Botão de Play circular na direita
                ctx.fillStyle = '#ff5a5f';
                ctx.beginPath();
                ctx.arc(boxX + boxW - 28, vY + vH / 2, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.moveTo(boxX + boxW - 32, vY + vH / 2 - 6);
                ctx.lineTo(boxX + boxW - 22, vY + vH / 2);
                ctx.lineTo(boxX + boxW - 32, vY + vH / 2 + 6);
                ctx.closePath();
                ctx.fill();

                // Palavra “CONTEÚDO”
                ctx.font = '700 21px SpaceGrotesk, sans-serif';
                ctx.fillStyle = '#fbf5ea';
                ctx.textAlign = 'center';
                ctx.fillText('“CONTEÚDO”', boxX + (boxW - 40) / 2, vY + vH / 2 + 7);
                ctx.restore();
              }

              if (t >= 5.05 && t <= 5.62) {
                const scanX = lerp(boxX, boxX + boxW, pScan);
                ctx.save();
                ctx.strokeStyle = OURO;
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(scanX, boxY);
                ctx.lineTo(scanX, boxY + boxH);
                ctx.stroke();
                ctx.restore();
              }
            }

            ctx.restore();
          }

          ctx.restore();
          ctx.restore();
        }

        // =====================================================================
        // 5. PARTE 3 (6.02s – 12.82s):
        //    - 6.02s – 10.00s: Preservado idêntico aos primeiros 10 segundos.
        //    - MOMENTO A (10.00s – 11.55s): Conclusão visual da história pela metade.
        //    - MOMENTO B (11.55s – 12.82s): Agrupamento físico das 3 publicações
        //      superficiais (sem desaparecimento arbitrário) + pega e arremesso
        //      pelo Echo com trajetória acelerada para fora do enquadramento!
        // =====================================================================
        function drawPart3SymptomsAndThrow(ctx, t) {
          if (t < 6.02 || t > 12.85) return;

          // Entre 11.35s e 11.95s, os 3 exemplos fictícios são fisicamente reunidos
          // pelo gesto do Echo em um pacote único na posição de pega (cx=228, cy=476),
          // e entre 12.24s e 12.82s o pacote é arremessado para fora pela esquerda/topo!
          const bundleGather = t <= 10.00 ? 0.0 : easeInOutCubic(invLerp(11.35, 11.92, t));
          const windupP = t <= 10.00 ? 0.0 : easeInOutCubic(invLerp(12.00, 12.24, t));
          const throwP = t <= 10.00 ? 0.0 : invLerp(12.24, 12.80, t);
          const throwAccel = throwP * throwP * (1.25 - 0.25 * throwP);

          const packShiftX = lerp(0, 24, windupP) + lerp(0, -590, throwAccel);
          const packShiftY = lerp(0, 10, windupP) + lerp(0, -295, throwAccel) - Math.sin(throwP * Math.PI) * 38;
          const packRotDeg = lerp(0, 7.5, windupP) + lerp(0, -46, easeInCubic(throwP));
          const packScale = lerp(1.0, 0.80, easeInCubic(throwP));

          if (throwP > 0.02 && throwP < 0.92) {
            ctx.save();
            ctx.globalAlpha = Math.sin(throwP * Math.PI) * 0.45;
            ctx.strokeStyle = '#ff8a7a';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([14, 10]);
            for (let tr = -1; tr <= 1; tr++) {
              ctx.beginPath();
              ctx.moveTo(250 + tr * 18, 480 + tr * 24);
              ctx.lineTo(250 + packShiftX * 0.78 + tr * 18, 480 + packShiftY * 0.78 + tr * 24);
              ctx.stroke();
            }
            ctx.restore();
          }

          // v11: cada cartão vira um objeto da praça, com a mesma geometria e os mesmos tempos:
          // TV que nunca termina de carregar, quadro-negro com a balança, livro rasgado.
          const PAPEL = '#fbf5ea';

          // -------------------------------------------------------------------
          // ESTAÇÃO 1: "VÍDEOS INTERMINÁVEIS" — uma TV
          // -------------------------------------------------------------------
          const s1Enter = easeBackOut(invLerp(6.04, 6.40, t), 1.2);
          const s1Compact = easeInOutCubic(invLerp(7.70, 8.04, t));
          const s1BaseX = 26;
          const s1BaseY = lerp(108, 72, s1Compact);
          const s1W = lerp(488, 326, bundleGather);
          const s1H = lerp(lerp(226, 192, s1Compact), 210, bundleGather);
          const s1X = lerp(s1BaseX, 55, bundleGather) + packShiftX;
          const s1Y = lerp(s1BaseY, 346, bundleGather) + packShiftY;
          const s1Rot = lerp(0, -5.5, bundleGather) + packRotDeg;

          ctx.save();
          ctx.translate(s1X + s1W / 2, s1Y + s1H / 2);
          if (Math.abs(s1Rot) > 0.0001) {
            ctx.rotate((s1Rot * Math.PI) / 180);
          }
          ctx.scale(clamp01(s1Enter) * packScale, clamp01(s1Enter) * packScale);
          ctx.translate(-(s1X + s1W / 2), -(s1Y + s1H / 2));

          // antenas e pés
          const antX = s1X + s1W * 0.5;
          ctx.strokeStyle = '#3a2c48';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(antX - 6, s1Y + 2); ctx.lineTo(antX - 52, s1Y - 34);
          ctx.moveTo(antX + 6, s1Y + 2); ctx.lineTo(antX + 46, s1Y - 38);
          ctx.stroke();
          ctx.fillStyle = '#f5b83d';
          ctx.beginPath(); ctx.arc(antX - 52, s1Y - 34, 3.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(antX + 46, s1Y - 38, 3.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#2a2034';
          ctx.fillRect(s1X + 40, s1Y + s1H - 2, 26, 8);
          ctx.fillRect(s1X + s1W - 66, s1Y + s1H - 2, 26, 8);

          ctx.shadowColor = 'rgba(10, 6, 22, 0.80)';
          ctx.shadowBlur = 26;
          ctx.shadowOffsetY = 8;
          const caixaTv = ctx.createLinearGradient(0, s1Y, 0, s1Y + s1H);
          caixaTv.addColorStop(0, '#5e4566');
          caixaTv.addColorStop(1, '#3a2a46');
          ctx.fillStyle = caixaTv;
          roundRect(ctx, s1X, s1Y, s1W, s1H, 20);
          ctx.fill();
          ctx.shadowColor = 'transparent';

          ctx.fillStyle = '#0f1426';
          roundRect(ctx, s1X + 7, s1Y + 7, s1W - 14, s1H - 14, 14);
          ctx.fill();
          const brilhoTela = ctx.createRadialGradient(s1X + s1W * 0.5, s1Y + s1H * 0.45, 10, s1X + s1W * 0.5, s1Y + s1H * 0.45, s1W * 0.6);
          brilhoTela.addColorStop(0, 'rgba(120, 200, 255, 0.12)');
          brilhoTela.addColorStop(1, 'rgba(120, 200, 255, 0)');
          ctx.fillStyle = brilhoTela;
          ctx.fill();

          ctx.strokeStyle = t < 7.75 ? '#ff5a5f' : 'rgba(255, 220, 200, 0.22)';
          ctx.lineWidth = t < 7.75 ? 2.4 : 1.4;
          roundRect(ctx, s1X, s1Y, s1W, s1H, 20);
          ctx.stroke();

          if (bundleGather > 0.001) {
            ctx.save();
            roundRect(ctx, s1X, s1Y, s1W, s1H, 20);
            ctx.clip();
          }

          // Indicador de modo/canal no topo esquerdo da TV (preenche espaço acima do título)
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          roundRect(ctx, s1X + 16, s1Y + 16, 32, 12, 3);
          ctx.fill();
          ctx.fillStyle = '#7fe3f5';
          ctx.beginPath();
          ctx.arc(s1X + 22, s1Y + 22, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 246, 232, 0.40)';
          roundRect(ctx, s1X + 28, s1Y + 20, 15, 4, 2);
          ctx.fill();

          // a TV nunca termina de carregar
          const carregX = s1X + s1W - 16;
          ctx.font = '700 12.5px Rajdhani, sans-serif';
          ctx.fillStyle = '#f3ead8';
          ctx.textAlign = 'right';
          ctx.fillText('CARREGANDO…', carregX, s1Y + 27.5);
          const carregW = ctx.measureText('CARREGANDO…').width;
          ctx.strokeStyle = '#7fe3f5';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(carregX - carregW - 12, s1Y + 23, 6, t * 7, t * 7 + Math.PI * 1.4);
          ctx.stroke();

          ctx.font = '700 22px SpaceGrotesk, sans-serif';
          ctx.fillStyle = '#fff6e8';
          ctx.textAlign = 'left';
          ctx.fillText('VÍDEOS INTERMINÁVEIS', s1X + 16, s1Y + 54);

          // R2/R3: Pill de metadados simulados à direita do título (sem palavras legíveis)
          if (s1W > 370) {
            const tagX = s1X + s1W - 138;
            const tagY = s1Y + 38;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            roundRect(ctx, tagX, tagY, 122, 18, 5);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.stroke();
            // ponto indicador vermelho de gravação/live
            ctx.fillStyle = '#ff5a5f';
            ctx.beginPath();
            ctx.arc(tagX + 12, tagY + 9, 3.5, 0, Math.PI * 2);
            ctx.fill();
            // barra-esqueleto de duração (42 px)
            ctx.fillStyle = 'rgba(255, 246, 232, 0.45)';
            roundRect(ctx, tagX + 22, tagY + 6.5, 42, 5, 2.5);
            ctx.fill();
            // barra-esqueleto de tags (38 px)
            ctx.fillStyle = 'rgba(127, 227, 245, 0.40)';
            roundRect(ctx, tagX + 74, tagY + 6.5, 38, 5, 2.5);
            ctx.fill();
          }

          const waveBoxY = s1Y + 68;
          const waveBoxH = lerp(64, 46, s1Compact);
          ctx.fillStyle = '#161b31';
          roundRect(ctx, s1X + 16, waveBoxY, s1W - 32, waveBoxH, 10);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
          ctx.lineWidth = 1;
          ctx.stroke();

          const clkX = s1X + 44;
          const clkY = waveBoxY + waveBoxH / 2;
          ctx.strokeStyle = 'rgba(127, 227, 245, 0.25)';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(clkX, clkY, 12, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = '#7fe3f5';
          ctx.beginPath();
          ctx.arc(clkX, clkY, 12, t * 6, t * 6 + Math.PI * 1.2);
          ctx.stroke();

          const numBars = 26;
          const barStartX = s1X + 74;
          const barSpanW = s1W - 110;
          for (let b = 0; b < numBars; b++) {
            const bx = barStartX + (b / numBars) * barSpanW;
            const amp = 0.25 + 0.70 * Math.abs(Math.sin(t * 9.0 + b * 0.55));
            const bh = Math.max(4, (waveBoxH - 14) * amp);
            const isUseful = b >= 22 && b <= 23;
            ctx.fillStyle = isUseful ? '#7fe3f5' : 'rgba(255, 90, 95, 0.72)';
            ctx.fillRect(bx, clkY - bh / 2, 4, bh);
          }

          const scrubProg = easeOutCubic(invLerp(6.16, 7.35, t));
          const tlY = waveBoxY + waveBoxH + lerp(12, 10, s1Compact);
          const tlW = s1W - 32;
          const tlH = lerp(17, 14, s1Compact);
          ctx.fillStyle = '#161b31';
          roundRect(ctx, s1X + 16, tlY, tlW, tlH, 6);
          ctx.fill();

          const seg1W = tlW * 0.14 * scrubProg;
          const seg2W = tlW * 0.78 * scrubProg;
          const seg3W = tlW * 0.08 * scrubProg;

          if (seg1W > 2) {
            ctx.fillStyle = '#6b6280';
            roundRect(ctx, s1X + 16, tlY, seg1W, tlH, 5);
            ctx.fill();
          }
          if (seg2W > 2) {
            ctx.fillStyle = '#ff5a5f';
            ctx.fillRect(s1X + 16 + seg1W, tlY, seg2W, tlH);
          }
          if (seg3W > 2) {
            ctx.fillStyle = '#7fe3f5';
            ctx.fillRect(s1X + 16 + seg1W + seg2W, tlY, seg3W, tlH);
          }

          const playheadX = s1X + 16 + (seg1W + seg2W + seg3W);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(playheadX - 1.5, tlY - 4, 3, tlH + 8);

          // R3: Descrição simulada do vídeo abaixo da linha do tempo
          const descY = tlY + tlH + lerp(9, 7, s1Compact);
          const avR = lerp(8.5, 7.5, s1Compact);
          const avX = s1X + 26;
          const avY = descY + avR;
          ctx.fillStyle = 'rgba(127, 227, 245, 0.40)';
          ctx.beginPath();
          ctx.arc(avX, avY, avR, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1;
          ctx.stroke();

          const barX = s1X + 40;
          const barAvailW = s1W - 56;
          // Barra forte simulando o título do canal
          ctx.fillStyle = 'rgba(255, 246, 232, 0.55)';
          roundRect(ctx, barX, descY + 1, Math.min(125, barAvailW * 0.46), 6.5, 3);
          ctx.fill();

          // Barras-esqueleto finas secundárias da descrição
          const subSpac = lerp(8.5, 7.5, s1Compact);
          const barWidthRatios = [0.88, 0.60, 0.76, 0.45];
          const barAlphas = [0.42, 0.35, 0.30, 0.25];
          const innerBottom = s1Y + s1H - 8;
          for (let sb = 0; sb < barWidthRatios.length; sb++) {
            const sby = descY + 10 + sb * subSpac;
            if (sby + 5 <= innerBottom - 6) {
              ctx.fillStyle = `rgba(243, 234, 216, ${barAlphas[sb]})`;
              roundRect(ctx, barX, sby, barAvailW * barWidthRatios[sb], 5, 2.5);
              ctx.fill();
            }
          }

          // linhas de varredura do vidro
          ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
          for (let yy = s1Y + 9; yy < s1Y + s1H - 9; yy += 3) ctx.fillRect(s1X + 8, yy, s1W - 16, 1);

          if (bundleGather > 0.001) {
            ctx.restore();
          }
          ctx.restore();

          // -------------------------------------------------------------------
          // ESTAÇÃO 2: "COMPARATIVOS SEM CONTEXTO" — quadro-negro com a balança
          // -------------------------------------------------------------------
          if (t >= 7.72) {
            const s2Enter = easeBackOut(invLerp(7.72, 8.10, t), 1.25);
            const s2Compact = easeInOutCubic(invLerp(9.52, 9.82, t));
            const s2BaseX = 26;
            const s2BaseY = lerp(314, 278, s2Compact);
            const s2W = lerp(488, 326, bundleGather);
            const s2H = lerp(lerp(208, 186, s2Compact), 180, bundleGather);
            const s2X = lerp(s2BaseX, 66, bundleGather) + packShiftX;
            const s2Y = lerp(s2BaseY, 360, bundleGather) + packShiftY;
            const s2Rot = lerp(0, 4.2, bundleGather) + packRotDeg;

            ctx.save();
            ctx.translate(s2X + s2W / 2, s2Y + s2H / 2);
            if (Math.abs(s2Rot) > 0.0001) {
              ctx.rotate((s2Rot * Math.PI) / 180);
            }
            ctx.scale(clamp01(s2Enter) * packScale, clamp01(s2Enter) * packScale);
            ctx.translate(-(s2X + s2W / 2), -(s2Y + s2H / 2));

            ctx.shadowColor = 'rgba(10, 6, 22, 0.80)';
            ctx.shadowBlur = 26;
            ctx.shadowOffsetY = 8;
            const madeira = ctx.createLinearGradient(0, s2Y, 0, s2Y + s2H);
            madeira.addColorStop(0, '#9a6a3c');
            madeira.addColorStop(1, '#6e4524');
            ctx.fillStyle = madeira;
            roundRect(ctx, s2X, s2Y, s2W, s2H, 14);
            ctx.fill();
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = '#26352f';
            roundRect(ctx, s2X + 7, s2Y + 7, s2W - 14, s2H - 14, 9);
            ctx.fill();
            const po = ctx.createRadialGradient(s2X + s2W * 0.45, s2Y + s2H * 0.4, 10, s2X + s2W * 0.45, s2Y + s2H * 0.4, s2W * 0.6);
            po.addColorStop(0, 'rgba(255, 255, 255, 0.07)');
            po.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = po;
            ctx.fill();

            ctx.strokeStyle = t < 9.55 ? '#f5b83d' : 'rgba(255, 230, 200, 0.22)';
            ctx.lineWidth = t < 9.55 ? 2.4 : 1.4;
            roundRect(ctx, s2X, s2Y, s2W, s2H, 14);
            ctx.stroke();

            if (bundleGather > 0.001) {
              ctx.save();
              roundRect(ctx, s2X, s2Y, s2W, s2H, 14);
              ctx.clip();
            }

            // Linha e marcas de giz no topo do quadro (preenche vazio acima do título)
            ctx.save();
            ctx.strokeStyle = 'rgba(239, 233, 218, 0.35)';
            ctx.lineWidth = 1.4;
            ctx.lineCap = 'round';
            // cantoneira superior esquerda
            ctx.beginPath();
            ctx.moveTo(s2X + 28, s2Y + 16);
            ctx.lineTo(s2X + 16, s2Y + 16);
            ctx.lineTo(s2X + 16, s2Y + 28);
            ctx.stroke();
            // cantoneira superior direita
            ctx.beginPath();
            ctx.moveTo(s2X + s2W - 28, s2Y + 16);
            ctx.lineTo(s2X + s2W - 16, s2Y + 16);
            ctx.lineTo(s2X + s2W - 16, s2Y + 28);
            ctx.stroke();
            // linha tracejada de giz entre as cantoneiras
            ctx.setLineDash([10, 8]);
            ctx.beginPath();
            ctx.moveTo(s2X + 38, s2Y + 16);
            ctx.lineTo(s2X + s2W - 38, s2Y + 16);
            ctx.stroke();
            ctx.restore();

            ctx.font = '700 22px SpaceGrotesk, sans-serif';
            ctx.fillStyle = '#f4f1e8';
            ctx.textAlign = 'left';
            ctx.fillText('COMPARATIVOS SEM CONTEXTO', s2X + 16, s2Y + 54);

            // Anotações de giz simuladas à direita do título (sem letras nem números)
            if (s2W > 370) {
              const thX = s2X + s2W - 116;
              const thY = s2Y + 36;
              ctx.save();
              ctx.strokeStyle = 'rgba(239, 233, 218, 0.45)';
              ctx.lineWidth = 1.6;
              ctx.lineCap = 'round';
              // 4 riscos verticais de contagem + 1 corte diagonal
              for (let k = 0; k < 4; k++) {
                ctx.beginPath();
                ctx.moveTo(thX + k * 6, thY);
                ctx.lineTo(thX + k * 6 + 1, thY + 14);
                ctx.stroke();
              }
              ctx.beginPath();
              ctx.moveTo(thX - 3, thY + 12);
              ctx.lineTo(thX + 22, thY + 2);
              ctx.stroke();

              // segundo grupo de 3 riscos
              for (let k = 0; k < 3; k++) {
                ctx.beginPath();
                ctx.moveTo(thX + 28 + k * 6, thY + 1);
                ctx.lineTo(thX + 28 + k * 6 + 1, thY + 14);
                ctx.stroke();
              }

              // sublinhado de giz sob os riscos
              ctx.beginPath();
              ctx.moveTo(thX - 2, thY + 18);
              ctx.lineTo(thX + 46, thY + 18);
              ctx.stroke();
              ctx.restore();
            }

            const bBoxY = s2Y + 68;
            const bMaxW = s2W - 138;
            const barGrow = easeOutCubic(invLerp(7.84, 8.28, t));

            // barras de giz, sem valor nenhum (nada a comparar de verdade)
            ctx.font = '700 13px SpaceGrotesk, sans-serif';
            ctx.fillStyle = '#e9e6dc';
            ctx.fillText('PLACA "A"', s2X + 16, bBoxY + 22);
            ctx.fillStyle = 'rgba(127, 227, 245, 0.85)';
            roundRect(ctx, s2X + 104, bBoxY + 6, Math.max(8, bMaxW * 0.80 * barGrow), 24, 6);
            ctx.fill();

            ctx.fillStyle = '#e9e6dc';
            ctx.fillText('PLACA "B"', s2X + 16, bBoxY + 54);
            ctx.fillStyle = 'rgba(200, 205, 198, 0.75)';
            roundRect(ctx, s2X + 104, bBoxY + 38, Math.max(8, bMaxW * 0.56 * barGrow), 24, 6);
            ctx.fill();

            // traço de giz nas barras
            ctx.strokeStyle = 'rgba(38, 53, 47, 0.35)';
            ctx.lineWidth = 1;
            for (let gx = s2X + 108; gx < s2X + 104 + bMaxW * 0.80 * barGrow - 4; gx += 8) {
              ctx.beginPath(); ctx.moveTo(gx, bBoxY + 8); ctx.lineTo(gx - 4, bBoxY + 28); ctx.stroke();
            }

            // balança de giz ao lado das barras, pendendo sem contexto
            if (barGrow > 0.01) {
              const bx0 = s2X + s2W - 52;
              const by0 = bBoxY + 12;
              const incl = 0.22 * barGrow;
              ctx.save();
              ctx.globalAlpha *= barGrow;

              ctx.strokeStyle = 'rgba(239, 233, 218, 0.42)';

              // seta para cima no lado esquerdo da balança (desenhada com linhas)

            }

            // perguntas de giz direto na lousa (sem caixas)
            const chalkQuestions = [
              { text: 'QUAL RESOLUÇÃO?', t0: 8.28, x: s2X + 24 },
              { text: 'QUAL PRESET?', t0: 8.46, x: s2X + 182 },

            ];
            const chalkY = bBoxY + 76;

            // Linha guia sutil de giz na altura das perguntas para preencher o espaço antes da entrada

            ctx.lineWidth = 1.0;
            ctx.setLineDash([4, 8]);
            ctx.beginPath();

            ctx.restore();

            chalkQuestions.forEach(cq => {
              if (t >= cq.t0) {

                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 5);
                ctx.lineTo(82, 5);
                ctx.stroke();
                ctx.restore();
              }
            });

            // Régua / eixo simulado de benchmark em giz abaixo das perguntas
            const rulerY = chalkY + 16;
            ctx.save();
            ctx.strokeStyle = 'rgba(239, 233, 218, 0.32)';
            ctx.lineWidth = 1.2;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(s2X + 24, rulerY);
            ctx.lineTo(s2X + s2W - 24, rulerY);

            ctx.setLineDash([]);
            // Marcas verticais de medição na régua

              for (let g = 0; g < numGroups; g++) {

          // -------------------------------------------------------------------
          // ESTAÇÃO 3: "HISTÓRIAS PELA METADE" — um livro com a segunda metade arrancada
          // -------------------------------------------------------------------
          if (t >= 9.55) {
            const s3Enter = easeBackOut(invLerp(9.55, 9.94, t), 1.2);
            const s3BaseX = 26;

            ctx.fillStyle = 'rgba(240, 226, 255, 0.18)';

            // página da esquerda: a primeira metade, inteira
            ctx.fillStyle = PAPEL;
            roundRect(ctx, bookX, bookY, bookW * splitRatio, bookH, 8);
            ctx.fill();
            const lombada = ctx.createLinearGradient(bookX + bookW * splitRatio - 18, 0, bookX + bookW * splitRatio, 0);

            roundRect(ctx, bookX + 14, bookY + 22, leftBarW * 0.62, 7, 2.5);

            ctx.fillStyle = '#c9bda6';
            const leftRatios = [0.94, 0.88, 0.96, 0.84, 0.92, 0.86, 0.48];

            const rightW = bookW * (1 - splitRatio) - 8;

            // página da direita (a metade que vai ser arrancada); f = quanto já se soltou
            const paginaSolta = (f) => {
              ctx.fillStyle = PAPEL;
              ctx.beginPath();
              ctx.moveTo(rightX + 6, bookY);
              ctx.lineTo(rightX + rightW - 8, bookY);
              ctx.quadraticCurveTo(rightX + rightW, bookY, rightX + rightW, bookY + 8);
              ctx.lineTo(rightX + rightW, bookY + bookH - 8);
              ctx.quadraticCurveTo(rightX + rightW, bookY + bookH, rightX + rightW - 8, bookY + bookH);
              ctx.lineTo(rightX + 6, bookY + bookH);
              for (let k = 9; k >= 0; k--) ctx.lineTo(rightX + (k % 2 ? 0 : 7) * f, bookY + (k * bookH) / 9);
              ctx.closePath();
              ctx.fill();
              ctx.setLineDash([5, 4]);
              ctx.strokeStyle = '#d6343a';
              ctx.lineWidth = 1.6;
              ctx.stroke();
              ctx.setLineDash([]);

              // R3: barras-esqueleto desenhadas dentro da folha para caírem junto quando arrancada
              const rightAvailW = rightW - 28;
              const rightStartX = rightX + 14 + (f > 0.1 ? 4 : 0);
              ctx.fillStyle = '#a89a80';
              roundRect(ctx, rightStartX, bookY + 22, rightAvailW * 0.58, 7, 2.5);
              ctx.fill();
              ctx.fillStyle = '#c9bda6';
              const rightRatios = [0.92, 0.85, 0.95, 0.80, 0.88, 0.82, 0.44];
              for (let ln = 0; ln < rightRatios.length; ln++) {
                roundRect(ctx, rightStartX, bookY + 41 + ln * 19, rightAvailW * rightRatios[ln], 6.5, 2.5);
                ctx.fill();
              }

            if (t <= 10.0001) {

            } else {

              ctx.save();
              ctx.globalAlpha = clamp01(cutProg * 1.35);

              roundRect(ctx, rightX, bookY, rightW, bookH, 8);
              ctx.fill();

              ctx.fillStyle = PAPEL;
              ctx.beginPath();
              ctx.moveTo(rightX, bookY);
              ctx.lineTo(rightX + 7, bookY);

              ctx.lineTo(rightX, bookY + bookH);
              ctx.closePath();
              ctx.fill();

              // R2: Emblema puramente gráfico no miolo (SEM texto / sem fillText)
              // Contorno tracejado "fantasma" da página ausente em lilás claro
              const ghostX = rightX + 14;
              const ghostY = bookY + 10;
              const ghostW = rightW - 22;

        // =====================================================================
        // 6. PUBLICAÇÃO REAL DO ESTRATÉGIA NERD (13.45s – 18.00s) — SEÇÕES 7 A 11
        // Artigo Real Verificado:

        function drawAdventurerCape(ctx, cx, cy, sc, t, isJumping, isRunning, isPulling, jumpProg) {

          const attachY = cy - 14 * sc;
          const attachX = cx - 8 * sc;

          ctx.beginPath();
          ctx.moveTo(attachX, attachY);

            // No salto: a capa faz uma parábola ascendente ampla no ar
            const flare = Math.sin(jumpProg * Math.PI) * 32 * sc;
            ctx.quadraticCurveTo(cx - 45 * sc, cy - 6 * sc - flare, cx - 68 * sc - flare * 0.4, cy + 20 * sc - flare * 0.5);

          } else if (isRunning) {
            // Na corrida: a capa flutua para trás com ondulação dinâmica rápida
            ctx.quadraticCurveTo(cx - 40 * sc, cy - 6 * sc + wave, cx - 62 * sc + wave * 0.6, cy + 18 * sc + wave);
            ctx.quadraticCurveTo(cx - 36 * sc, cy + 20 * sc - wave * 0.5, cx - 14 * sc, cy + 4 * sc);
          } else if (isPulling) {
            // Puxando a alavanca: a capa cai inclinada com o peso do corpo jogado para trás
            ctx.quadraticCurveTo(cx - 30 * sc, cy - 2 * sc, cx - 42 * sc, cy + 28 * sc);
            ctx.quadraticCurveTo(cx - 24 * sc, cy + 24 * sc, cx - 12 * sc, cy + 6 * sc);
          } else {
            // Em repouso/observação: caimento suave com leve brisa
            const idleBreeze = Math.sin(t * 3.5) * 4 * sc;
            ctx.quadraticCurveTo(cx - 26 * sc, cy + idleBreeze, cx - 36 * sc + idleBreeze * 1.2, cy + 26 * sc);
            ctx.quadraticCurveTo(cx - 20 * sc, cy + 22 * sc, cx - 10 * sc, cy + 6 * sc);
          }

          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
          ctx.lineWidth = 1.2 * sc;
          ctx.stroke();

            const legSwing = Math.sin(t * 14.0) * 12 * heroSc;
            roundRect(ctx, heroX - 11 * heroSc - legSwing, legY, legW, legH, 4);
            ctx.fill();
            roundRect(ctx, heroX + 1 * heroSc + legSwing, legY, legW, legH, 4);
            ctx.fill();
          } else {
            roundRect(ctx, heroX - 11 * heroSc, legY, legW, legH, 4);
            ctx.fill();
            roundRect(ctx, heroX + 1 * heroSc, legY, legW, legH, 4);
            ctx.fill();
          }

          // Corpo e Cabeça Oficiais do Echo
          ctx.save();
          ctx.translate(heroX, heroY);
          ctx.rotate(heroTilt);
          ctx.scale(heroSc, heroSc);
          ctx.drawImage(echoCanvas, -echoSize / 2, -echoSize / 2, echoSize, echoSize);

          ctx.fillStyle = '#f59e0b';

          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 1.0;
          ctx.stroke();

          // Mãos Oficiais do Echo
          let handL, handR;
          if (isPulling) {
            const ballX = leverBaseX + Math.sin(leverAngle) * 62;
            const ballY = leverBaseY - Math.cos(leverAngle) * 62;
            handL = { x: ballX - 6, y: ballY, scale: 0.95 * heroSc };
            handR = { x: ballX + 6, y: ballY - 2, scale: 0.95 * heroSc };

            handL = { x: heroX - 32 * heroSc, y: heroY - 14, scale: 0.92 * heroSc };
            handR = { x: heroX + 32 * heroSc, y: heroY - 14, scale: 0.92 * heroSc };
          } else if (isRunning) {
            handL = { x: heroX - 26 * heroSc, y: heroY + 14 + Math.sin(t * 14.0) * 12, scale: 0.90 * heroSc };
            handR = { x: heroX + 26 * heroSc, y: heroY + 14 - Math.sin(t * 14.0) * 12, scale: 0.90 * heroSc };
          } else {
            handL = { x: heroX - 28 * heroSc, y: heroY + 14, scale: 0.92 * heroSc };
            handR = { x: heroX + 28 * heroSc, y: heroY - 6, scale: 0.95 * heroSc };
          }
          drawOfficialEchoHands(ctx, handL, handR, 16.5, director.cyanCol);

          ctx.restore(); // Fecha transformação de câmera
          ctx.restore(); // Fecha save global
        }
        // =====================================================================

          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2.4;

          const scrX = monX + 8;
          const scrY = monY + 8;

          // B. 32.20s – 35.00s: Echo intervém; abre menu de configurações ilustrativo
          // C. 35.00s – 37.04s: Ajuste realizado; jogo fluido; compra descartada!
          const isMenuOpen = t >= 32.20;

            // Opção 2: Efeitos Pesados / Ray Tracing (Ajuste antes do gasto!)
            // 34.00s é quando o cursor clica e ajusta!
            const isAdjusted = t >= 34.00;

            ctx.font = '500 12px SpaceGrotesk';
            ctx.fillStyle = '#cbd5e1';

            // Botão toggle do ajuste
            const btnX = panX + panW - 130;

            ctx.fillStyle = isAdjusted ? '#059669' : '#dc2626';

              ctx.fillStyle = 'rgba(16, 185, 129, 0.18)';

              ctx.strokeStyle = '#10B981';
              ctx.lineWidth = 1.4;
              ctx.stroke();

              ctx.font = '700 11.5px JetBrainsMono';

              ctx.font = '500 10.5px SpaceGrotesk';
              ctx.fillStyle = '#94a3b8';
              ctx.fillText('Verificar configurações antes de gastar por impulso.', panX + panW / 2, panY + 196);
            }

            // Cursor Físico do Jogador navegando e clicando na opção
            const curP = invLerp(32.80, 34.00, t);
            if (t >= 32.80 && t < 34.60) {
              const curX = lerp(panX + 80, btnX + 45, easeOutCubic(curP));
              const curY = lerp(panY + 180, btnY + 12, easeOutCubic(curP));
              drawSoftwareCursor(ctx, curX, curY, t >= 33.95 && t <= 34.15);

            ctx.restore();
          }

          ctx.restore(); // Fecha clip da tela interna do monitor

          // 5. O OBJETO DE COMPRA IMPULSIVA (CARRINHO / CAIXA DE UPGRADE)
          // 30.60s – 32.20s: Aparece na lateral direita como a tentação de gastar
          // 32.20s – 33.50s: Echo apoia a mão e redireciona com gentileza
          // 34.20s – 37.04s: Desvanece suavemente pois a decisão foi consciente!
          let cartAlpha = 0.0;
          let cartX = 390;
          let cartY = 320;

          if (t >= 30.60 && t < 32.20) {
            cartAlpha = easeOutCubic(invLerp(30.60, 31.20, t));
          } else if (t >= 32.20 && t < 34.50) {
            const pMove = easeInOutCubic(invLerp(32.20, 33.50, t));
            cartAlpha = 1.0;
            cartX = lerp(390, 440, pMove); // Echo afasta suavemente
          } else if (t >= 34.50) {
            cartAlpha = 1.0 - easeOutCubic(invLerp(34.50, 35.40, t)); // Desvanece sem agressividade
          }

          if (cartAlpha > 0.01) {
            ctx.save();
            ctx.globalAlpha = cartAlpha * pIntro;

            roundRect(ctx, -60, -45, 120, 90, 8);

            ctx.lineWidth = 1.6;

            ctx.fillStyle = '#c7d2fe';
            ctx.fillText('COMPRA POR IMPULSO', 0, 15);
            ctx.font = '500 8.5px SpaceGrotesk';
            ctx.fillStyle = '#a5b4fc';
            ctx.fillText('Gastar sem investigar?', 0, 30);
            ctx.restore();
          }

          ctx.restore();

        // Cursor do Sistema / Software com clique tátil

          ctx.moveTo(0, 0);
          ctx.lineTo(0, 16);
          ctx.lineTo(4, 12);
          ctx.lineTo(9, 19);
          ctx.lineTo(12, 17);
          ctx.lineTo(7, 10);
          ctx.lineTo(12, 10);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.0;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        }

          // Desenho da cena de jogo dentro da tela do monitor
          drawGameplayViewport(ctx, scrX, scrY, scrW, scrH, t, false);

          ctx.restore();

          // LED piloto do monitor
          ctx.fillStyle = '#00F0FF';
          ctx.beginPath();
          ctx.arc(monX + monW - 16, monY + monH - 4, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

          // 2. A CAMADA DA PUBLICAÇÃO EDITORIAL SENDO LEVANTADA (18.00s – 19.80s)
          // ------------------------------------------------------------------
          const pLift = easeInOutCubic(invLerp(18.50, 19.70, t));
          if (pLift < 0.99) {
            ctx.save();
            // A publicação é suspensa para cima e levemente inclinada
            const pubCX = lerp(enPubState.cx, 240, pLift);
            const pubCY = lerp(enPubState.cy, -280, Math.pow(pLift, 1.4));
            const pubRot = lerp(0.0, -14.0, pLift);
            const pubAlpha = lerp(1.0, 0.0, invLerp(19.25, 19.70, t));

            const liftedPubState = Object.assign({}, enPubState, {
              cx: pubCX,
              cy: pubCY,
              rotDeg: pubRot,
              alpha: pubAlpha,
              scale: lerp(enPubState.scale, 0.92, pLift)
            });

            // Sombra projetada do card levantado sobre a mesa/setup
            ctx.shadowColor = `rgba(0, 0, 0, ${0.7 * (1.0 - pLift)})`;
            ctx.shadowBlur = 32 * (1.0 + pLift);
            ctx.shadowOffsetY = 16 * (1.0 + pLift * 2.0);

            drawEstrategiaNerdRealPublication(ctx, liftedPubState);
            ctx.restore();
          }

          ctx.restore();
        }

        // =====================================================================
        // =====================================================================
        // VIEWPORT DA GAMEPLAY DE CORRIDA V9: "ECHO PILOTO AO PÔR DO SOL" (20.96s – 24.62s)
        // Inspirado diretamente no painel "CORRIDA" da imagem de referência oficial:
        // - Pôr do sol degradê radiante com sol poente, montanhas em paralaxe e pinheiros.
        // - Guardrails com iluminação neon ciano e asfalto com reflexos e velocidade tangível.
        // - Esportivo vermelho clássico (conversível / cockpit visível).
        // - Echo Oficial ao volante: cabeça, olhos expressivos, tronco e mãos oficiais no volante.
        // - Microstutter determinístico (21.88s e 22.42s): engasgo da pista, tremor de suspensão,
        //   sobressalto do Echo, careta 'flat' e mãos tensas no volante.
        // - Estabilização suave a 60 FPS (23.00s+): alívio, sorriso 'happy' e condução fluida.
        // - Transição motivada (24.40s – 24.96s): pórtico ancestral de pedra que cresce em 3D
        //   e preenche o quadro em corte motivado contínuo para o RPG!
        // =====================================================================
        function drawGameplayViewportV9(ctx, vx, vy, vw, vh, t, isFullscreen) {
          ctx.save();

          const horizonY = vy + vh * 0.44;
          const roadCX = vx + vw * 0.50;

          // 1. Céu com Pôr do Sol Radiante
          const skyGrad = ctx.createLinearGradient(0, vy, 0, horizonY);
          skyGrad.addColorStop(0, '#150d2a');
          skyGrad.addColorStop(0.35, '#3c1b4d');
          skyGrad.addColorStop(0.65, '#8b2653');
          skyGrad.addColorStop(0.85, '#ea580c');
          skyGrad.addColorStop(1, '#f59e0b');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(vx, vy, vw, vh);

          // Sol Poente Radiante no Horizonte
          const sunX = roadCX;
          const sunY = horizonY - 4;
          const sunR = isFullscreen ? 56 : 28;
          const sunGrad = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, sunR);
          sunGrad.addColorStop(0, '#fef08a');
          sunGrad.addColorStop(0.65, '#f59e0b');
          sunGrad.addColorStop(1, 'rgba(234, 88, 12, 0)');
          ctx.fillStyle = sunGrad;
          ctx.beginPath();
          ctx.arc(sunX, sunY, sunR, Math.PI, 0);
          ctx.fill();

          // 2. Montanhas em Silhueta em 2 Camadas de Paralaxe
          ctx.fillStyle = '#2d1238';
          ctx.beginPath();
          ctx.moveTo(vx, horizonY);
          ctx.lineTo(vx, horizonY - 42);
          ctx.lineTo(vx + vw * 0.22, horizonY - 78);
          ctx.lineTo(vx + vw * 0.46, horizonY - 38);
          ctx.lineTo(vx + vw * 0.74, horizonY - 88);
          ctx.lineTo(vx + vw, horizonY - 46);
          ctx.lineTo(vx + vw, horizonY);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#1c0c24';
          ctx.beginPath();
          ctx.moveTo(vx, horizonY);
          ctx.lineTo(vx, horizonY - 26);
          ctx.lineTo(vx + vw * 0.35, horizonY - 54);
          ctx.lineTo(vx + vw * 0.65, horizonY - 22);
          ctx.lineTo(vx + vw * 0.88, horizonY - 58);
          ctx.lineTo(vx + vw, horizonY - 28);
          ctx.lineTo(vx + vw, horizonY);
          ctx.closePath();
          ctx.fill();

          // 3. CÁLCULO DE VELOCIDADE E MICROSTUTTER DETERMINÍSTICO
          const isStutter1 = (t >= 21.88 && t <= 22.04);
          const isStutter2 = (t >= 22.42 && t <= 22.60);
          const isAnyStutter = isStutter1 || isStutter2;

          let roadSpeed;
          let screenShakeX = 0;
          let screenShakeY = 0;

          if (isStutter1) {
            roadSpeed = 21.88 * 420;
            screenShakeX = Math.sin((t - 21.88) * 60) * 3.5;
            screenShakeY = Math.cos((t - 21.88) * 60) * 2.8;
          } else if (isStutter2) {
            roadSpeed = 22.42 * 420;
            screenShakeX = Math.sin((t - 22.42) * 65) * 4.5;
            screenShakeY = Math.cos((t - 22.42) * 65) * 3.5;
          } else {
            roadSpeed = t * 420;
          }

          if (screenShakeX !== 0) {
            ctx.translate(screenShakeX, screenShakeY);
          }

          // 4. PISTA DE ASFALTO EM PERSPECTIVA 3D COM REFLEXOS
          const roadBottomW = vw * 0.94;
          const roadTopW = vw * 0.12;
          const roadLeftTop = roadCX - roadTopW / 2;
          const roadRightTop = roadCX + roadTopW / 2;
          const roadLeftBot = roadCX - roadBottomW / 2;
          const roadRightBot = roadCX + roadBottomW / 2;

          ctx.beginPath();
          ctx.moveTo(roadLeftTop, horizonY);
          ctx.lineTo(roadRightTop, horizonY);
          ctx.lineTo(roadRightBot, vy + vh);
          ctx.lineTo(roadLeftBot, vy + vh);
          ctx.closePath();
          ctx.fillStyle = '#10141f';
          ctx.fill();

          // Reflexo dourado no asfalto
          const sheenGrad = ctx.createLinearGradient(roadCX - 28, horizonY, roadCX + 28, horizonY);
          sheenGrad.addColorStop(0, 'rgba(245, 158, 11, 0.0)');
          sheenGrad.addColorStop(0.5, 'rgba(251, 191, 36, 0.18)');
          sheenGrad.addColorStop(1, 'rgba(245, 158, 11, 0.0)');
          ctx.fillStyle = sheenGrad;
          ctx.beginPath();
          ctx.moveTo(roadCX - 8, horizonY);
          ctx.lineTo(roadCX + 8, horizonY);
          ctx.lineTo(roadCX + 46, vy + vh);
          ctx.lineTo(roadCX - 46, vy + vh);
          ctx.closePath();
          ctx.fill();

          // 5. GUARDRAILS COM ILUMINAÇÃO NEON CIANO
          for (let s = 1; s <= 9; s++) {
            const p0 = Math.pow((s - 1) / 9, 2.2);
            const p1 = Math.pow(s / 9, 2.2);
            const y0 = lerp(horizonY, vy + vh, p0);
            const y1 = lerp(horizonY, vy + vh, p1);
            const lx0 = lerp(roadLeftTop, roadLeftBot, p0);
            const lx1 = lerp(roadLeftTop, roadLeftBot, p1);
            const rx0 = lerp(roadRightTop, roadRightBot, p0);
            const rx1 = lerp(roadRightTop, roadRightBot, p1);

            ctx.strokeStyle = '#00F0FF';
            ctx.lineWidth = Math.max(1.5, 4.5 * p1);
            ctx.shadowColor = '#00F0FF';
            ctx.shadowBlur = Math.max(2, 8 * p1);
            ctx.beginPath(); ctx.moveTo(lx0, y0); ctx.lineTo(lx1, y1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx0, y0); ctx.lineTo(rx1, y1); ctx.stroke();
            ctx.shadowBlur = 0;
          }

          // Faixas centrais brancas em perspectiva
          for (let lane = -1; lane <= 1; lane += 2) {
            const laneRatio = 0.30 * lane;
            for (let dash = 1; dash <= 9; dash++) {
              const pD = Math.pow(((dash * 0.11 + roadSpeed * 0.0035) % 1.0), 2.4);
              if (pD > 0.04) {
                const dy = lerp(horizonY, vy + vh, pD);
                const dx = lerp(roadCX, roadCX + (roadBottomW / 2) * laneRatio, pD);
                const dw = Math.max(1.8, 8.0 * pD);
                const dh = Math.max(4.0, 36.0 * pD);

                ctx.fillStyle = isAnyStutter ? 'rgba(239, 68, 68, 0.9)' : '#f8fafc';
                roundRect(ctx, dx - dw / 2, dy, dw, dh, dw / 2);
                ctx.fill();
              }
            }
          }

          // 6. PINHEIROS NAS MARGENS DA RODOVIA
          for (let side = -1; side <= 1; side += 2) {
            for (let tr = 0; tr < 5; tr++) {
              const pProg = ((tr * 0.20 + roadSpeed * 0.0024) % 1.0);
              if (pProg > 0.05) {
                const py = lerp(horizonY, vy + vh, Math.pow(pProg, 2.0));
                const sideTop = side < 0 ? roadLeftTop - 12 : roadRightTop + 12;
                const sideBot = side < 0 ? roadLeftBot - 42 : roadRightBot + 42;
                const px = lerp(sideTop, sideBot, pProg);
                const trScale = pProg;
                const trH = 65 * trScale;
                const trW = 26 * trScale;

                ctx.fillStyle = '#0a1017';
                ctx.beginPath();
                ctx.moveTo(px, py - trH);
                ctx.lineTo(px + trW / 2, py);
                ctx.lineTo(px - trW / 2, py);
                ctx.closePath();
                ctx.fill();
              }
            }
          }

          // 7. O CARRO ESPORTIVO VERMELHO COM ECHO AO VOLANTE
          const carScale = isFullscreen ? 1.0 : 0.62;
          const carCX = roadCX;
          const carCY = vy + vh * (isFullscreen ? 0.74 : 0.73);
          const carW = 220 * carScale;
          const carH = 110 * carScale;

          // Sombra projetada
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          ctx.beginPath();
          ctx.ellipse(carCX, carCY + carH * 0.42, carW * 0.58, carH * 0.18, 0, 0, Math.PI * 2);
          ctx.fill();

          // Assento traseiro / interior da cabine (fundo)
          ctx.fillStyle = '#090d16';
          roundRect(ctx, carCX - carW * 0.28, carCY - carH * 0.44, carW * 0.56, carH * 0.46, 10);
          ctx.fill();

          // Se for tela cheia, Echo Oficial é desenhado aqui, perfeitamente integrado no assento do motorista!
          if (isFullscreen) {
            const echoSeatY = carCY - carH * 0.38;
            const echoSc = 0.50 * carScale;

            ctx.save();
            ctx.translate(carCX, echoSeatY);
            ctx.scale(echoSc, echoSc);
            ctx.drawImage(echoCanvas, -echoSize / 2, -echoSize / 2, echoSize, echoSize);
            ctx.restore();
          }

          // Chassi / Capô esportivo vermelho (Ferrari red)
          const carGrad = ctx.createLinearGradient(0, carCY - carH * 0.15, 0, carCY + carH * 0.45);
          carGrad.addColorStop(0, '#ef4444');
          carGrad.addColorStop(0.45, '#dc2626');
          carGrad.addColorStop(1, '#991b1b');
          ctx.fillStyle = carGrad;
          roundRect(ctx, carCX - carW / 2, carCY - carH * 0.15, carW, carH * 0.50, 8);
          ctx.fill();
          ctx.strokeStyle = '#f87171';
          ctx.lineWidth = 1.6 * carScale;
          ctx.stroke();

          // Vinco central do capô e scoop
          ctx.fillStyle = '#7f1d1d';
          roundRect(ctx, carCX - carW * 0.14, carCY - carH * 0.08, carW * 0.28, carH * 0.16, 4);
          ctx.fill();

          // Faróis retangulares quentes (amarelo/âmbar, idênticos à ilustração de referência)
          const lightW = 36 * carScale;
          const lightH = 18 * carScale;
          const lightY = carCY + carH * 0.08;

          for (let lx of [-1, 1]) {
            const lX = carCX + lx * (carW * 0.36) - lightW / 2;
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 14 * carScale;
            roundRect(ctx, lX, lightY, lightW, lightH, 3);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }

          // Para-choque frontal baixo
          ctx.fillStyle = '#0a0f1d';
          roundRect(ctx, carCX - carW * 0.40, carCY + carH * 0.26, carW * 0.80, carH * 0.14, 4);
          ctx.fill();

          // Para-brisa e Moldura do Cockpit
          const wsW = carW * 0.58;
          const wsH = carH * 0.32;
          ctx.strokeStyle = '#e2e8f0';
          ctx.lineWidth = 2.0 * carScale;
          ctx.strokeRect(carCX - wsW / 2, carCY - carH * 0.30, wsW, wsH);

          // Volante Esportivo
          const wheelR = 26 * carScale;
          const wheelCY = carCY - carH * 0.12;
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 5.0 * carScale;
          ctx.beginPath();
          ctx.arc(carCX, wheelCY, wheelR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#00F0FF';
          ctx.beginPath();
          ctx.arc(carCX, wheelCY, 5 * carScale, 0, Math.PI * 2);
          ctx.fill();

          // Mãos Oficiais do Echo no Volante
          if (isFullscreen) {
            const hL = { x: carCX - 24 * carScale, y: wheelCY - 6 * carScale, scale: 0.90 * 0.50 * carScale };
            const hR = { x: carCX + 24 * carScale, y: wheelCY - 6 * carScale, scale: 0.90 * 0.50 * carScale };
            drawOfficialEchoHands(ctx, hL, hR, 16.5, director.cyanCol);
          }

          // 8. TELEMETRIA MINIMALISTA DE JOGO (HUD no topo)
          const hudW = Math.min(vw - 24, 290);
          const hudH = 34;
          const hudX = vx + (vw - hudW) / 2;
          const hudY = vy + 12;

          roundRect(ctx, hudX, hudY, hudW, hudH, 8);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fill();
          ctx.strokeStyle = isAnyStutter ? 'rgba(239, 68, 68, 0.8)' : 'rgba(0, 240, 255, 0.45)';
          ctx.lineWidth = 1.4;
          ctx.stroke();

          ctx.font = '700 11px "JetBrainsMono", monospace';
          ctx.textAlign = 'left';
          ctx.fillStyle = '#f8fafc';
          ctx.fillText('SPEED: 240 KM/H', hudX + 12, hudY + 21);

          ctx.textAlign = 'right';
          if (isAnyStutter) {
            ctx.fillStyle = '#ef4444';
            ctx.fillText('⚠️ 48.2 ms [STUTTER]', hudX + hudW - 12, hudY + 21);
          } else {
            ctx.fillStyle = '#00F0FF';
            ctx.fillText('✓ 16.6 ms (60 FPS)', hudX + hudW - 12, hudY + 21);
          }

          // 9. TRANSIÇÃO CINEMATOGRÁFICA MOTIVADA (24.40s – 24.96s)
          // O carro avança e ultrapassa um imenso pórtico ancestral de pedra que cresce em 3D
          if (t >= 24.35 && t <= 25.00) {
            const pGate = invLerp(24.35, 24.96, t);
            const gateScale = Math.pow(pGate, 1.8) * 2.8 + 0.12;
            const gateW = vw * gateScale;
            const gateH = vh * gateScale;
            const gateCX = roadCX;
            const gateCY = horizonY + (carCY - horizonY) * Math.pow(pGate, 1.3);

            ctx.save();
            ctx.fillStyle = '#050a14';
            const pW = Math.max(20, gateW * 0.22);
            ctx.fillRect(gateCX - gateW / 2, gateCY - gateH, pW, gateH * 2);
            ctx.fillRect(gateCX + gateW / 2 - pW, gateCY - gateH, pW, gateH * 2);
            ctx.fillRect(gateCX - gateW / 2, gateCY - gateH, gateW, pW * 1.3);

            ctx.strokeStyle = '#00F0FF';
            ctx.lineWidth = Math.max(1.4, 2.2 * gateScale);
            ctx.strokeRect(gateCX - gateW / 2 + 4, gateCY - gateH + 4, gateW - 8, pW * 1.3 - 8);
            ctx.restore();
          }

          ctx.restore();
        }

        function drawGameplayViewport(ctx, vx, vy, vw, vh, t, isFullscreen) {
          return drawGameplayViewportV9(ctx, vx, vy, vw, vh, t, isFullscreen);
        }

        function drawHardwareSensoryExperienceScene(ctx, t, pProg) {
          if (pProg <= 0.01) return;
          ctx.save();
          ctx.globalAlpha = clamp01(pProg);

          const cx = 270;
          const cy = 410;
          const w = 508;
          const h = 620;

          roundRect(ctx, cx - w / 2, cy - h / 2, w, h, 14);
          ctx.fillStyle = '#05070e';
          ctx.fill();
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)';
          ctx.lineWidth = 2.0;
          ctx.stroke();
          ctx.clip();

          drawGameplayViewportV9(ctx, cx - w / 2, cy - h / 2, w, h, t, true);

          ctx.restore();
        }
        let lastAuditState = {};
        const urlParams = (typeof window !== 'undefined' && window.location) ? new URLSearchParams(window.location.search) : null;
        const urlOffset = (urlParams && urlParams.has('offset')) ? parseFloat(urlParams.get('offset')) : null;
        window.__segmentOffset = urlOffset !== null ? urlOffset : 10.0;

        function renderAtAbsoluteTime(t) {
          t = clamp(t, 0, 37.04);
          window.__currentTimeMs = t * 1000;

          const b = director.bot;
          const s = b.s;
          b.tw = [];
          b.lock = {};
          b.t0 = 0;
          b.last = t * 1000;

          // 7.1. FUNDO — v11: as coordenadas da v9 (540x960) são desenhadas em 1080x1920
          ctx.setTransform(2, 0, 0, 2, 0, 0);
          ctx.clearRect(0, 0, 540, 960);
          if (t < 18.0) {
            desenharPracaV11(ctx, t);
          } else {
          const bgGrad = ctx.createRadialGradient(270, 420, 30, 270, 460, 580);
          bgGrad.addColorStop(0, '#121b2e');
          bgGrad.addColorStop(0.65, '#090d18');
          bgGrad.addColorStop(1, '#05070c');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 540, 960);

          ctx.save();
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.035)';
          ctx.lineWidth = 1;
          for (let gx = 45; gx < 540; gx += 90) {
            ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 960); ctx.stroke();
          }
          for (let gy = 60; gy < 960; gy += 90) {
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(540, gy); ctx.stroke();
          }
          ctx.restore();
          }

          // 7.2. FLUXO DE 15 NOTÍCIAS SECUNDÁRIAS PADRONIZADAS (Sempre ativo!)
          // Quando Echo sai brevemente (12.90s – 13.55s), o fluxo de fundo ganha leve destaque
          // para manter o cenário rico e vivo, acomodando-se quando a publicação real entra.
          // 7.2. FLUXO DE NOTÍCIAS SECUNDÁRIAS (Ajuste V8: integrado no editorial, oculto em cenas imersivas)
          let bgDim = 1.0;
          if (t >= 0.95 && t < 6.00) {
            bgDim = lerp(1.0, 0.52, easeOutCubic((t - 0.95) / 0.95));
          } else if (t >= 6.00 && t <= 12.60) {
            bgDim = lerp(0.52, 0.22, easeInOutCubic(invLerp(6.00, 6.45, t)));
          } else if (t > 12.60 && t < 13.95) {
            bgDim = lerp(0.22, 0.50, easeInOutCubic(invLerp(12.60, 13.15, t)));
          } else if (t >= 13.95 && t < 18.00) {
            bgDim = lerp(0.50, 0.26, easeInOutCubic(invLerp(13.95, 14.55, t)));
          } else if (t >= 18.00 && t < 20.40) {
            bgDim = lerp(0.26, 0.08, invLerp(18.00, 19.50, t));
          } else if (t >= 20.40) {
            // Em cenas imersivas de gameplay e hardware, as notícias dão espaço total à demonstração
            bgDim = 0.0;
          }
          if (bgDim > 0.005) {
            for (const item of BG_NEWS) {
              drawBgNewsItem(ctx, item, t, bgDim);
            }
          }

          // 7.3. COREOGRAFIA DA NOTÍCIA DA GPU (0.00s a 6.35s — INTACTA)
          let cardCX = 128;
          let cardCY = 152;
          let cardW = 212;
          let cardH = 70;
          let cardRot = -3.0;
          let cardScale = 0.94;
          let expandProg = 0.0;
          let impactFlash = 0.0;
          let cardAlpha = 1.0;

          if (t < 0.50) {
            cardCX = 118 + t * 72;
            cardCY = 148 + Math.sin(t * 2.5) * 8;
            cardW = 212;
            cardH = 70;
            cardRot = -3.2 + t * 1.8;
            cardScale = 0.94;
            expandProg = 0.0;
          } else if (t < 0.68) {
            const pAppr = easeInCubic((t - 0.50) / 0.18);
            const startX = 118 + 0.50 * 72;
            const startY = 148 + Math.sin(0.50 * 2.5) * 8;
            cardCX = lerp(startX, 252, pAppr);
            cardCY = lerp(startY, 256, pAppr);
            cardW = 212;
            cardH = 70;
            cardRot = lerp(-2.3, 3.2, pAppr);
            cardScale = lerp(0.94, 0.96, pAppr);
            expandProg = 0.0;
          } else if (t < 0.92) {
            const pHit = (t - 0.68) / 0.24;
            const recoil = Math.sin(pHit * Math.PI) * 8.5;
            cardCX = 252 - recoil * 0.55;
            cardCY = 256 - recoil * 0.75;
            cardW = 212 + Math.sin(pHit * Math.PI * 2) * 5;
            cardH = 70 - Math.sin(pHit * Math.PI * 2) * 2.5;
            cardRot = 3.2 - Math.sin(pHit * Math.PI) * 5.5;
            cardScale = 0.96;
            expandProg = 0.0;
            impactFlash = Math.max(0, 1.0 - pHit * 1.35);
          } else if (t < 1.85) {
            const pGrow = (t - 0.92) / 0.93;
            const growCurve = easePush(pGrow);

            expandProg = clamp(growCurve, 0, 1);
            cardCX = lerp(252, 270, easeOutCubic(pGrow));
            cardCY = lerp(256, 334, growCurve);
            cardW = lerp(212, 448, growCurve);
            cardH = lerp(70, 364, growCurve);
            cardScale = lerp(0.96, 1.0, easeOutCubic(pGrow));

            const struggleWave = Math.sin(pGrow * Math.PI * 4.5) * (1 - pGrow) * 1.6;
            cardRot = lerp(2.0, 0.0, easeOutCubic(pGrow)) + struggleWave;
          } else if (t < 6.00) {
            const pSettle = (t - 1.85) / 0.70;
            const settle = pSettle < 1.0
              ? Math.exp(-pSettle * 5.0) * Math.cos(pSettle * Math.PI * 3.0)
              : 0.0;
            const neqPulse = (t >= 2.22 && t <= 2.48)
              ? Math.sin(((t - 2.22) / 0.26) * Math.PI) * 2.5
              : 0.0;
