      if (T >= 37.48 && T <= 37.61) olhos = 'pill'; // piscada ao mudar foco
      if (T >= 39.80 && T <= 39.93) olhos = 'pill'; // piscada
      if (T >= 41.20 && T <= 41.33) olhos = 'pill'; // piscada
      if (T >= 43.70 && T <= 43.83) olhos = 'pill'; // piscada
      if (T >= 46.40 && T <= 46.53) olhos = 'pill'; // piscada
      if (T >= 49.35 && T <= 49.48) olhos = 'pill'; // piscada ao mudar foco
      if (T >= 51.20 && T <= 51.33) olhos = 'pill'; // piscada
      if (T >= 52.95 && T <= 53.08) olhos = 'pill'; // piscada

      if (T > 48.00) {
        if (T >= 49.62 && T < 51.20) olhos = 'happy';
        else if (T >= 51.58 && T < 52.95) olhos = 'happy';
        else if (T >= 53.10 && T < 53.95) olhos = 'pill';
        else if (T >= 53.95) {
          if (T <= 54.00) {
            olhos = 'happy';
          } else {
            if (T >= 55.40 && T <= 55.53) olhos = 'pill';
            else if (T >= 57.80 && T <= 57.93) olhos = 'pill';
            else olhos = 'happy';
          }
        }
      }

      // Movimento organico do olhar: idêntico antes de 39.80 s
      let lx = lerp(0.2, 0.0, uGaze);
      let ly = lerp(0.0, -0.06, uGaze);
      if (uDesk > 0.05 && uDesk < 0.95) {
        // Echo acompanha visualmente o controle sendo pousado na mesa
        lx = lerp(0.2, 0.42, Math.sin(Math.PI * uDesk));
        ly = lerp(0.0, 0.08, Math.sin(Math.PI * uDesk));
      } else if (T < 39.80) {
        if (T >= 39.10 && T < 40.20) {
          // Relance para Card 1 ("Questionar")
          const r1 = Math.sin(Math.PI * inv(39.10, 40.20, T));
          lx = lerp(lx, 0.38, r1);
          ly = lerp(ly, 0.06, r1);
        }
      } else if (T < 40.95) {
        // Acompanha Card 2 ("Investigar")
        const r2 = Math.sin(Math.PI * inv(39.80, 40.95, T));
        lx = lerp(lx, 0.38, r2);
        ly = lerp(ly, 0.10, r2);
      } else if (T < 42.07) {
        // Acompanha Card 3 ("Comparar")
        const r3 = Math.sin(Math.PI * inv(40.95, 42.07, T));
        lx = lerp(lx, 0.38, r3);
        ly = lerp(ly, 0.16, r3);
      } else if (T < 43.80) {
        // Acompanha Card 4 ("Explicar")
        const r4 = Math.sin(Math.PI * inv(42.07, 43.80, T));
        lx = lerp(lx, 0.38, r4);
        ly = lerp(ly, 0.22, r4);
      } else {
        // Transição de foco para a síntese / Opinião
        const uOpGaze = eIO(inv(43.80, 44.60, T));
        lx = lerp(lx, 0.22, uOpGaze);
        ly = lerp(ly, 0.02, uOpGaze);
        if (T > 48.00) {
          if (T < 51.20) {
            // Echo volta-se para o espectador ("Quer entender antes de escolher?")
            const uFront = eIO(inv(48.90, 49.60, T));
            lx = lerp(0.22, 0.0, uFront);
            ly = lerp(0.02, -0.04, uFront);
          } else if (T < 53.00) {
            // Foco no símbolo oficial da marca ("Estratégia Nerd.")
            const uBrand = eIO(inv(51.20, 51.70, T));
            lx = lerp(0.0, 0.20, uBrand);
            ly = lerp(-0.04, 0.02, uBrand);
          } else if (T < 53.80) {
            // Acompanha corte do achismo ("Nada de achismo.")
            const uAch = eIO(inv(53.00, 53.30, T));
            lx = lerp(0.20, 0.18, uAch);
            ly = lerp(0.02, 0.08, uAch);
          } else {
            // Resolução confiante ("só estratégia" -> B4)
            const uB4 = eIO(inv(53.80, 54.00, T));
            lx = lerp(0.18, 0.06, uB4);
            ly = lerp(0.08, -0.02, uB4);
            if (T > 54.00) {
              if (T < 55.62) {
                const uG1 = eIO(inv(54.00, 54.60, T));
                lx = lerp(0.06, 0.04, uG1);
                ly = lerp(-0.02, -0.02, uG1);
              } else if (T < 57.64) {
                const uG2 = eIO(inv(55.62, 56.40, T));
                lx = lerp(0.04, 0.16, uG2);
                ly = lerp(-0.02, 0.04, uG2);
              } else {
                const uG3 = eIO(inv(57.64, 58.40, T));
                lx = lerp(0.16, 0.0, uG3);
                ly = lerp(0.04, -0.03, uG3);
              }
            }
          }
        }
      }

      // Torso e inclinacao: inclina suavemente em direcao a mesa durante o pouso, depois postura ereta
      const leanDesk = 0.055 * Math.sin(Math.PI * uDesk);
      const idleBob = 0.012 * Math.sin(T * 3.2);
      let yaw = lerp(0.0, 0.16, uTurn);
      const lean = lerp(-0.04, 0.0, uTrans) + leanDesk + 0.008 * Math.sin(T * 2.1);
      let inclina = lerp(0.03, 0.01, uTrans);

      if (T > 48.00) {
        // Vira-se suavemente para frente a partir de 49.12 s
        const uTurnFront = eIO(inv(49.12, 49.70, T));
        yaw = lerp(0.16, 0.02, uTurnFront);
        // Pequena virada ao apresentar a marca
        const uTurnBrand = eIO(inv(51.20, 51.70, T));
        yaw = lerp(yaw, 0.12, uTurnBrand);
        // Inclinação sutil expressiva na pergunta
        const uTilt = Math.sin(Math.PI * inv(49.60, 51.20, T));
        inclina += 0.04 * uTilt;
        if (T > 54.00) {
          const uTurnB4 = eIO(inv(54.00, 56.00, T));
          yaw = lerp(0.12, 0.05, uTurnB4);
          if (T >= 57.80 && T <= 58.60) {
            inclina += 0.03 * Math.sin(Math.PI * inv(57.80, 58.60, T));
          }
        }
      }

      const pose = {
        olhar: [lx, ly],
        olhos,
        cor: CIANO,
        yaw,
        lean,
        inclina,
        sx: 1,
        sy: 1 + idleBob,
        aperto: 1,
        controle: 0  // controle e maos posicionados e desenhados explicitamente
      };

      // 3. Sala e Echo
      salaQuadro(SALA_Q, JOGO, REC.rpg, (c) => {
        const { x, y, k } = SENTADO;

        // Desenhar robo Echo
        pelaBase(c, posar(T, Object.assign({ k }, pose)), x, y);

        // Trajetoria continua do controle: do colo ([252, 1294]) ate a superficie visivel da mesa ([360, 1122])
        // Tampo da mesa esta em X: 356..990, Y: 1110..1130
        const ctrlX = lerp(x, 360, uDesk);
        const arcY = -18 * Math.sin(Math.PI * uDesk); // arco natural de elevacao ao pousar
        const ctrlY = lerp(y - 44, 1122, uDesk) + arcY;
        const ctrlRot = lerp(-0.05, 0.10, uDesk);
        controle(c, ctrlX, ctrlY, ctrlRot, 0.6);

        // Mao direita: segura o grip direito do controle e pousa sobre a mesa ao lado
        const rAng = ctrlRot;
        const gripDirX = ctrlX + 38 * Math.cos(rAng) + 6;
        const gripDirY = ctrlY + 38 * Math.sin(rAng) + 4;
        const maoDir = [gripDirX, gripDirY, 1];

        // Mao esquerda: segura o grip esquerdo ate pousar na mesa; depois libera e gesticula
        let maoEsq;
        if (T < 37.85) {
          const gripEsqX = ctrlX - 38 * Math.cos(rAng) - 6;
          const gripEsqY = ctrlY - 38 * Math.sin(rAng) + 4;
          maoEsq = [gripEsqX, gripEsqY, 1];
        } else if (T < 38.60) {
          const uSolta = eIO(inv(37.85, 38.50, T));
          const soltaX = lerp(360 - 44, 240, uSolta);
          const soltaY = lerp(1126, 1280, uSolta);
          maoEsq = [soltaX, soltaY, 1];
        } else if (T < 39.80) {
          // Gesto expressivo apontando para Card 1 (idêntico à versão atual até 39.80 s)
          const uAponte = eIO(inv(38.60, 39.30, T));
          const mx = lerp(240, 385, uAponte);
          const my = lerp(1280, 1160, uAponte);
          maoEsq = [mx, my, 1];
        } else if (T < 40.95) {
          // Aponta para Card 2 ("Investigar")
          const uP2 = eIO(inv(39.80, 40.15, T));
          const mx = lerp(385, 390, uP2);
          const my = lerp(1160, 1230, uP2);
          maoEsq = [mx, my, 1];
        } else if (T < 42.07) {
          // Aponta para Card 3 ("Comparar")
          const uP3 = eIO(inv(40.95, 41.28, T));
          const mx = lerp(390, 392, uP3);
          const my = lerp(1230, 1310, uP3);
          maoEsq = [mx, my, 1];
        } else if (T < 43.80) {
          // Aponta para Card 4 ("Explicar")
          const uP4 = eIO(inv(42.07, 42.40, T));
          const mx = lerp(392, 388, uP4);
          const my = lerp(1310, 1390, uP4);
          maoEsq = [mx, my, 1];
        } else {
          // Recolhimento suave do braço para postura explicativa aberta
          const uExp = eIO(inv(43.80, 44.60, T));
          const bob = 5 * Math.sin(T * 2.8);
          let mx = lerp(388, 355, uExp);
          let my = lerp(1390, 1210, uExp) + bob;
          if (T > 48.00) {
            if (T < 51.10) {
              // Gesto suave para a interrogação / pergunta
              const uGestQ = eIO(inv(49.40, 50.00, T));
              mx = lerp(355, 385, uGestQ);
              my = lerp(1210, 1160, uGestQ) + bob;
            } else if (T < 53.00) {
              // Apresenta a marca
              const uGestBrand = eIO(inv(51.20, 51.80, T));
              mx = lerp(385, 395, uGestBrand);
              my = lerp(1160, 1130, uGestBrand) + bob;
            } else if (T < 53.80) {
              // Gesto firme ao riscar o achismo
              const uGestAch = eIO(inv(53.00, 53.40, T));
              mx = lerp(395, 375, uGestAch);
              my = lerp(1130, 1170, uGestAch) + bob;
            } else {
              // Postura contínua ativa para o bloco B4
              const uGestB4 = eIO(inv(53.80, 54.00, T));
              mx = lerp(375, 365, uGestB4);
              my = lerp(1170, 1160, uGestB4) + bob;
              if (T > 54.00) {
                if (T < 55.62) {
                  mx = 365;
                  my = 1160 + bob;
                } else if (T < 56.58) {
                  const uP1 = eIO(inv(55.62, 56.30, T));
                  mx = lerp(365, 345, uP1);
                  my = lerp(1160, 1220, uP1) + bob;
                } else if (T < 57.64) {
                  const uP2 = eIO(inv(56.58, 57.20, T));
                  mx = lerp(345, 348, uP2);
                  my = lerp(1220, 1310, uP2) + bob;
                } else {
                  const uWaveIn = eIO(inv(57.64, 58.30, T));
                  const uWaveOut = eIO(inv(58.80, 59.80, T));
                  let mxW = lerp(348, 335, uWaveIn);
                  let myW = lerp(1310, 1140, uWaveIn);
                  if (T >= 58.00 && T <= 59.20) {
                    const wOsc = 14 * Math.sin((T - 58.00) * 8.0) * Math.sin(Math.PI * inv(58.00, 59.20, T));
                    mxW += wOsc;
                  }
                  mx = lerp(mxW, 320, uWaveOut);
                  my = lerp(myW, 1180, uWaveOut) + bob;
                }
              }
            }
          }
          maoEsq = [mx, my, 1];
        }

        maos(c, k, [maoEsq, maoDir]);
      });

      // 4. Camera da sala: push-in cinematografico equilibrado (1.00 -> 1.25 em 39.50 s)
      // Antes de 39.80 s: z e enquadramento idênticos à versão anterior
      // Depois de 39.80 s: deriva sutil e contínua até 48.00 s (sem corte)
      const uCam = eIO(inv(37.40, 39.50, T));
      let z = lerp(1.00, 1.25, uCam);
      let camFx = 480, camFy = 1150;
      if (T > 39.80) {
        const uDrift = eIO(inv(39.80, 48.00, T));
        z = lerp(1.25, 1.272, uDrift);
        camFx = lerp(480, 485, uDrift);
        camFy = lerp(1150, 1155, uDrift);
        if (T > 48.00) {
          const uDrift2 = inv(48.00, 54.00, T);
          z = lerp(1.272, 1.282, eIO(uDrift2));
          camFx = lerp(485, 488, eIO(uDrift2));
          camFy = lerp(1155, 1158, eIO(uDrift2));
          if (T > 54.00) {
            const uDriftB4 = eIO(inv(54.00, 59.80, T));
            z = lerp(1.282, 1.210, uDriftB4);
            camFx = lerp(488, 495, uDriftB4);
            camFy = lerp(1158, 1170, uDriftB4);
          }
        }
      }
      camSala(QX, SALA_Q, JOGO, REC.rpg, z, camFx, camFy);

      // 5. CARDS DO METODO NO FOREGROUND (desenhados em QX apos camSala)
      // Area segura Reels rigorosa: X in [430, 880] (<= 925), Y in [1096, 1514] (<= 1540)
      // Card 1 QUESTIONAR: mantém entrada em 39.00
      const a1 = eOut(inv(39.00, 39.40, T));
      const s1 = 0.92 + 0.08 * a1;

      // Card 2 INVESTIGAR: entrada em 39.86 (ease 39.83..40.15)
      const a2 = eOut(inv(39.83, 40.15, T));
      const s2 = 0.92 + 0.08 * a2;

      // Card 3 COMPARAR: entrada em 40.98 (ease 40.95..41.25)
      const a3 = eOut(inv(40.95, 41.25, T));
      const s3 = 0.92 + 0.08 * a3;

      // Card 4 EXPLICAR: entrada em 42.10 (ease 42.07..42.37)
      const a4 = eOut(inv(42.07, 42.37, T));
      const s4 = 0.92 + 0.08 * a4;

      // Recolhimento / compactação dos 4 cards a partir de 43.80 s
      const uRec = eIO(inv(43.80, 44.50, T));
      const escCards = lerp(1.0, 0.85, uRec);
      const alfaCards = lerp(1.0, 0.70, uRec);

      const y1 = lerp(1120, 1196, uRec);
      const y2 = lerp(1222, 1272, uRec);
      const y3 = lerp(1324, 1348, uRec);
      const y4 = lerp(1426, 1424, uRec);

      // Saída suave dos cards e cápsula do B2 entre 49.12 s e 49.58 s
      const uOutB2 = T >= 49.12 ? eIO(inv(49.12, 49.58, T)) : 0;
      const fadeB2 = 1 - uOutB2;
      const slideB2X = -50 * uOutB2;

      cardMetodo(QX, 430 + slideB2X, y1, 450, 88, '1', 'QUESTIONAR', a1 * alfaCards * fadeB2, s1 * escCards, 'lupa');
      cardMetodo(QX, 430 + slideB2X, y2, 450, 88, '2', 'INVESTIGAR', a2 * alfaCards * fadeB2, s2 * escCards, 'grafico');
      cardMetodo(QX, 430 + slideB2X, y3, 450, 88, '3', 'COMPARAR', a3 * alfaCards * fadeB2, s3 * escCards, 'comparar');
      cardMetodo(QX, 430 + slideB2X, y4, 450, 88, '4', 'EXPLICAR', a4 * alfaCards * fadeB2, s4 * escCards, 'explicar');

      // 6. Elemento visual OPINIÃO (43.80 s a 49.58 s)
      const aOp = eOut(inv(44.20, 44.75, T));
      const sOp = 0.90 + 0.10 * aOp;
      cardOpiniao(QX, 430 + slideB2X, 1096, 450, 88, aOp * fadeB2, sOp);

      // Linha dinâmica de conexão de OPINIÃO com as fontes (46.88 s a 49.58 s)
      if (T >= 46.88 && T < 49.58) {
        const uLinha = inv(46.88, 48.90, T);
        const startX = 477 + slideB2X, startY = 1184; // Centro do badge de OPINIÃO
        const endY = 1380; // Estende-se em direção aos badges das fontes
        const curY = startY + (endY - startY) * uLinha;

        QX.save();
        QX.globalAlpha = fadeB2;
        QX.strokeStyle = '#00d4ff';
        QX.lineWidth = 3.0;
        QX.setLineDash([8, 6]);
        QX.lineDashOffset = -T * 36; // Em movimento contínuo
        QX.beginPath();
        QX.moveTo(startX, startY);
        QX.lineTo(startX, curY);
        QX.stroke();

        // Partícula guia na ponta da linha em movimento
        QX.setLineDash([]);
        QX.fillStyle = '#00d4ff';
        QX.shadowColor = '#00d4ff';
        QX.shadowBlur = 12;
        QX.beginPath();
        QX.arc(startX, curY, 4.5, 0, Math.PI * 2);
        QX.fill();

        // Selo / check discreto quando a linha atinge as fontes (48.85 s a 49.58 s)
        if (T >= 48.85) {
          const uSelo = eOut(inv(48.85, 49.08, T));
          QX.fillStyle = 'rgba(0, 212, 255, ' + (0.28 * uSelo) + ')';
          QX.strokeStyle = '#00d4ff';
          QX.lineWidth = 2.2;
          QX.beginPath();
          QX.arc(startX, endY, 14 * uSelo, 0, Math.PI * 2);
          QX.fill();
          QX.stroke();

          QX.strokeStyle = '#ffffff';
          QX.lineWidth = 2.4;
          QX.beginPath();
          QX.moveTo(startX - 6 * uSelo, endY);
          QX.lineTo(startX - 2 * uSelo, endY + 4 * uSelo);
          QX.lineTo(startX + 6 * uSelo, endY - 4 * uSelo);
          QX.stroke();
        }

        QX.restore();
      }

      // 7. BLOCO B3: ELEMENTOS NARRATIVOS (49.55 s a 54.00 s)
      // (a) Interrogação: "Quer entender antes de escolher?" (49.55 s a 51.50 s)
      if (T >= 49.55 && T < 51.50) {
        const aQ = T < 51.05 ? eOut(inv(49.60, 49.95, T)) : (1 - eIn(inv(51.05, 51.45, T)));
        const sQ = 0.88 + 0.12 * aQ;
        const bobQ = 5 * Math.sin(T * 3.5);
        cardPergunta(QX, 430, 1140 + bobQ, 450, 96, aQ, sQ);
      }

      // (b) Símbolo oficial e Marca: "Estratégia Nerd." (51.50 s a 60.00 s)
      if (T >= 51.50) {
        if (T <= 54.00) {
          const aM = eOut(inv(51.50, 51.90, T));
          const pulseM = 1 + 0.015 * Math.sin(T * 4.0);
          // Quando o achismo entra, a marca sobe sutilmente de 1140 para 1110
          const uShift = eIO(inv(53.05, 53.35, T));
          const yM = lerp(1140, 1110, uShift);
          cardMarca(QX, 430, yM, 450, 96, aM, pulseM, BRAND_SYMBOL_IMG, T);
        } else {
          // BLOCO B4 (54.00 a 60.00 s)
          // (a) Marca Hero: transição contínua para cápsula maior (texto 48px)
          const uHero = eIO(inv(54.00, 54.80, T));
          const xM = lerp(430, 340, uHero);
          const yM = lerp(1110, 1060, uHero);
          const wM = lerp(450, 560, uHero);
          const hM = lerp(96, 106, uHero);

          // Pulso sincronizado na palavra "estratégia" (54.52 a 55.28 s)
          let glowWord = 0;
          if (T >= 54.52 && T <= 55.28) {
            glowWord = Math.sin(Math.PI * inv(54.52, 55.28, T));
          }
          const pulseM = 1 + 0.015 * Math.sin(T * 4.0) + 0.035 * glowWord;
          cardMarcaB4(QX, xM, yM, wM, hM, 1.0, pulseM, BRAND_SYMBOL_IMG, T, glowWord);

          // (b) CTA: "LINK NA BIO" (55.62 a 60.00 s; texto surge com a fala em 56.08..56.58 s)
          if (T >= 55.62) {
            const aCta = eOut(inv(55.62, 56.10, T));
            const aText = eOut(inv(56.08, 56.45, T));
            const pulseCta = 1 + 0.012 * Math.sin(T * 3.6);
            cardCtaB4(QX, 340, 1184, 560, 100, aCta, pulseCta, aText, T);
          }

          // (c) Handle: "@estrategia_nerd" (56.58 a 60.00 s com a fala "e siga o perfil")
          if (T >= 56.58) {
            const aHandle = eOut(inv(56.58, 57.05, T));
            const pulseHandle = 1 + 0.012 * Math.sin(T * 3.4 + 1.0);
            cardHandleB4(QX, 340, 1304, 560, 100, aHandle, pulseHandle, T);
          }
        }
      }

      // (c) "Nada de achismo." com traço cortando (53.05 s a 54.30 s)
      if (T >= 53.05 && T <= 54.30) {
        const aAch = eOut(inv(53.05, 53.30, T));
        const uSlash = inv(53.35, 53.68, T);
        let fadeResolv;
        if (T <= 54.00) {
          fadeResolv = T >= 53.72 ? lerp(1.0, 0.42, inv(53.72, 54.00, T)) : 1.0;
        } else {
          fadeResolv = lerp(0.42, 0.0, inv(54.00, 54.30, T));
        }
        cardAchismo(QX, 430, 1224, 450, 96, aAch * fadeResolv, 1.0, uSlash, T);
      }
    }

    function render(T) {
      T = clamp(T, 18, 60.0);
      QX.setTransform(1, 0, 0, 1, 0, 0); QX.globalAlpha = 1; QX.globalCompositeOperation = 'source-over';
      QX.clearRect(0, 0, W, H);
      if (T < 20.96) t1(T);
      else if (T < 24.0) corrida(T);
      else if (T < 25.60) t2(T);
      else if (T < 29.95) rpg(T);
      else if (T < 31.0) t3(T);
      else if (T <= 37.04) setup(T);
      else metodo(T);
      const m = MASTER.getContext('2d');
      m.save(); m.setTransform(1, 0, 0, 1, 0, 0); m.globalAlpha = 1; m.globalCompositeOperation = 'source-over';
      m.filter = 'none'; m.shadowBlur = 0; m.imageSmoothingEnabled = true; m.imageSmoothingQuality = 'high';
      m.clearRect(0, 0, MASTER.width, MASTER.height);
      m.drawImage(Q, 0, 0, MASTER.width, MASTER.height);
      m.restore();
    }

    const pronto0 = window.__ready;
    window.__ready = pronto0.then(() => {
      MASTER = document.getElementById('master-canvas');
      const seekV9 = window.__seek, setTimeV9 = window.__setTime;
      const off = () => (typeof window.__segmentOffset === 'number' ? window.__segmentOffset : 0);
      seekV9(17.999 - off());                            // último quadro intocável, desenhado pela própria v9
      CONG = document.createElement('canvas'); CONG.width = MASTER.width; CONG.height = MASTER.height;
